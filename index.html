<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Site &amp; Soil Field Log</title>
<meta name="description" content="Record a site and soil evaluation in the field and export it to Excel, Word or PDF.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#508EB9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Site &amp; Soil">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{color-scheme:light dark}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bayon&family=Open+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column field clipboard. West Coast Septic brand: Blue 2 bar, Bayon titles, Open Sans body, low-poly water drop on white. */
:root{
  --bg:#F2F7F9; --surface:#FFFFFF; --sunk:#F6FAFB; --ink:#1D2A33; --muted:#5A6B77; --line:#D3E3EA;
  --accent:#508EB9; --accent-text:#3A7099; --accent-soft:#E2EFF5; --accent-ink:#FFFFFF;
  --b1:#4B85C4; --b2:#508EB9; --b3:#5FA9CF; --b4:#72ACC9; --b5:#9ACFD5; --b6:#C1E1EA;
  --ok:#2B7A4B; --ok-soft:#DFF1E6; --bad:#B0281F; --bad-soft:#F8E1DE; --warn:#8E6200; --warn-soft:#F6ECD3;
  --water:#4B85C4;
  --f-display:"Bayon","Oswald","Arial Narrow",Impact,sans-serif;
  --f-body:"Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px; --drop-op:.5; --bar:#508EB9; --bar-ink:#FFFFFF;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D171E; --surface:#14222C; --sunk:#101C25; --ink:#E2EDF2; --muted:#93A9B6; --line:#243747;
  --accent:#72ACC9; --accent-text:#9ACFD5; --accent-soft:#183243; --accent-ink:#0A1620;
  --ok:#6FCF97; --ok-soft:#173826; --bad:#F2877D; --bad-soft:#3E1C19; --warn:#E3B54E; --warn-soft:#3A2E12;
  --water:#9ACFD5; --drop-op:0; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D171E; --surface:#14222C; --sunk:#101C25; --ink:#E2EDF2; --muted:#93A9B6; --line:#243747;
  --accent:#72ACC9; --accent-text:#9ACFD5; --accent-soft:#183243; --accent-ink:#0A1620;
  --ok:#6FCF97; --ok-soft:#173826; --bad:#F2877D; --bad-soft:#3E1C19; --warn:#E3B54E; --warn-soft:#3A2E12;
  --water:#9ACFD5; --drop-op:0; color-scheme:dark }
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--bar-ink)}
.bar .wrap{display:flex;align-items:center;gap:8px;min-height:58px;padding-block:6px}
.bar h1{font-family:var(--f-display);font-weight:400;font-size:25px;letter-spacing:.05em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-wrap:balance}
.bar .sub{display:block;font-family:var(--f-body);font-weight:500;font-size:13px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:inherit;flex:none}
.iconbtn:active{background:rgba(255,255,255,.18)}
.iconbtn svg{width:24px;height:24px}

main.wrap{padding-block:16px 120px;display:flex;flex-direction:column;gap:16px}

/* Generic blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.card h2{font-family:var(--f-display);font-size:23px;font-weight:400;margin:0;letter-spacing:.05em;color:var(--accent-text);text-wrap:balance}
.card h3{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0;font-weight:600}
.hint{color:var(--muted);font-size:15px;margin:0}
.eyebrow{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 140px;min-width:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Fields */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lbl{font-weight:600;font-size:15px}
.field .unit{font-weight:400;color:var(--muted)}
input[type=text],input[type=search],input[type=tel],input[type=email],input[type=date],input[type=number],input:not([type]),select,textarea{
  width:100%;min-height:50px;border:1.5px solid var(--line);border-radius:8px;background:var(--sunk);padding:10px 12px;font-size:17px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);background:var(--surface);outline:none}
textarea{min-height:96px;resize:vertical}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 14px;border-radius:22px;border:1.5px solid var(--line);background:var(--sunk);font-size:16px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.chip .sw{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:6px;border:1px solid rgba(0,0,0,.25)}

.other-in{margin-top:2px}
/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 18px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:18px;text-align:center}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:44px;padding:6px 14px;font-size:15px}
.btn:disabled{opacity:.5}

/* Lists of navigable things */
.navlist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.navitem{display:flex;align-items:center;gap:14px;padding:14px 16px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;width:100%;min-height:68px}
.navitem:first-child{border-top:0}
.navitem:active{background:var(--sunk)}
.navitem .t{flex:1;min-width:0}
.navitem .t b{display:block;font-size:18px;font-weight:600}
.navitem .t span{display:block;color:var(--muted);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navitem .chev{width:20px;height:20px;color:var(--muted);flex:none}
.step{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:14px;font-weight:500;border:1.5px solid var(--line);color:var(--muted)}
.step.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.step.part{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.step svg{width:18px;height:18px}

.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:12px;font-size:14px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.na{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.pill.ex{background:var(--warn-soft);color:var(--warn)}

/* Summary figures */
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.fig{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.fig .k{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.fig .v{font-family:var(--f-mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.fig .v small{font-size:14px;color:var(--muted);font-family:var(--f-body)}

/* Soil profile strip */
.pitwrap{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:start}
.profile{position:relative;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden;background:repeating-linear-gradient(135deg,var(--sunk) 0 6px,var(--line) 6px 7px)}
.profile .lyr{position:absolute;left:0;right:0;border-top:1px solid rgba(0,0,0,.35);font-family:var(--f-mono);font-size:11px;padding:2px 4px;color:#111;overflow:hidden}
.profile .lyr.dk{color:#F3F3F3}
.profile .mark{position:absolute;left:-2px;right:-2px;height:0;border-top:2.5px dashed var(--water)}
.profile .mark.rl{border-top:2.5px solid var(--bad)}
.ticks{position:relative;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.legend{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.legend i{display:inline-block;width:22px;vertical-align:middle;margin-right:6px}
@media (max-width:420px){.pitwrap{grid-template-columns:80px 1fr}}

/* Layer cards */
.layer{border:1.5px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--sunk)}
.layer-head{display:flex;align-items:center;gap:10px}
.layer-head .swatch{width:28px;height:28px;border-radius:6px;border:1px solid rgba(0,0,0,.3);flex:none}
.layer-head b{flex:1;font-family:var(--f-mono);font-weight:500;font-size:16px}

/* Permeability readings */
.readings{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.readings th{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:6px 4px;font-weight:600}
.readings td{padding:4px;border-top:1px solid var(--line);vertical-align:middle}
.readings td.min{font-family:var(--f-mono);width:56px;color:var(--muted)}
.readings td.rate{font-family:var(--f-mono);width:92px;text-align:right}
.readings td.use{width:56px;text-align:right}
.readings tr.excl td.rate{text-decoration:line-through;color:var(--muted)}
.readings input{min-height:46px}
.tog{min-width:46px;min-height:40px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-size:13px;font-weight:600}
.tog[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.timer{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r);background:var(--accent-soft)}
.timer .clock{font-family:var(--f-mono);font-size:28px;font-weight:500;flex:1}

/* Setbacks */
.sb{display:grid;grid-template-columns:1fr 104px 68px;gap:8px 10px;align-items:center}
.sb .name{font-size:16px;line-height:1.25;min-width:0}
.sb .name small{display:block;color:var(--muted);font-family:var(--f-mono);font-size:13px}
.sb input{min-height:46px;text-align:right}
.sb .st{text-align:right}
.sb .hdr{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.sb .hdr.r{text-align:right}

/* Photos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.photo{display:flex;flex-direction:column;gap:6px;min-width:0}
.photo img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid var(--line);max-width:100%}
.photo input{min-height:44px;font-size:15px}

/* Bottom action bar */
.actions{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.actions .wrap{display:flex;gap:10px;padding-block:10px 0}
.actions .wrap>*{flex:1}

/* Toast & sheet */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:22px;font-weight:600;font-size:15px;z-index:20;max-width:calc(100% - 32px);text-align:center}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet h2{font-family:var(--f-display);font-weight:400;letter-spacing:.05em;margin:0;font-size:24px}

.terms-box{max-height:46vh;overflow:auto;border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--sunk);font-size:14px;line-height:1.5}
.terms-box h4{font-family:var(--f-body);font-size:15px;margin:14px 0 4px}
.terms-box p{margin:0 0 8px}
.terms-sum{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.agree{display:flex;gap:12px;align-items:flex-start;font-size:16px;line-height:1.35;cursor:pointer}
.agree input{width:26px;height:26px;flex:none;margin-top:1px;accent-color:var(--accent)}
.note{border-left:4px solid var(--warn);background:var(--warn-soft);padding:10px 12px;border-radius:6px;font-size:15px}
.foot{color:var(--muted);font-size:13px;text-align:center;padding-top:8px}
.home-hero{position:relative;display:flex;flex-direction:column;gap:6px;padding:8px 96px 8px 0;min-height:110px}
.home-hero .drop{position:absolute;right:6px;top:4px;width:66px;height:auto}
.home-hero h2{font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1;letter-spacing:.05em;margin:0;color:var(--accent-text)}
.home-hero .brandlogo{max-height:56px;max-width:220px;width:auto;align-self:flex-start;margin-bottom:6px}
.home-hero p{margin:0;color:var(--muted)}
.center{text-align:center}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .18s ease-out}@keyframes pop{from{transform:translate(-50%,8px);opacity:.2}}}

/* ============================================================
   Storage: IndexedDB, falls back to memory
   ============================================================ */
const store=(()=>{let dbp=null;function open(){if(dbp)return dbp;dbp=new Promise((res,rej)=>{try{const r=indexedDB.open("ssfl",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return dbp}
  async function get(k){try{const db=await open();return await new Promise((res,rej)=>{const t=db.transaction("kv").objectStore("kv").get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error)})}catch(e){return undefined}}
  async function set(k,v){try{const db=await open();await new Promise((res,rej)=>{const t=db.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)});return true}catch(e){return false}}
  async function del(k){try{const db=await open();await new Promise((res,rej)=>{const t=db.transaction("kv","readwrite");t.objectStore("kv").delete(k);t.oncomplete=res;t.onerror=()=>rej(t.error)});return true}catch(e){return false}}
  async function getPrefix(pre){try{const db=await open();return await new Promise((res,rej)=>{const t=db.transaction("kv").objectStore("kv").getAll(IDBKeyRange.bound(pre,pre+"\uffff"));t.onsuccess=()=>res(t.result||[]);t.onerror=()=>rej(t.error)})}catch(e){return[]}}
  return{get,set,del,getPrefix}})();

/* ============================================================
   State
   ============================================================ */
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>new Date().toISOString().slice(0,10);
function newPit(n){return{id:uid(),name:"TP"+n,location:"",depth:"",layers:[],wtObserved:"",wtDepth:"",shwt:"",shwtBasis:"",rlType:"",rlDepth:"",limiting:"",notes:""}}
function newLayer(from){return{id:uid(),from:from??"",to:"",colour:"",texture:"",grade:"",type:"",cons:"",cfKind:"",cfPct:"",roots:"",mottDepth:"",mottQty:"",moisture:"",notes:""}}
function newHole(n){return{id:uid(),name:String(n),location:"",pit:"",readings:["","","","","","","","",""],excl:[]}}
function newSite(){return{id:uid(),example:false,created:Date.now(),updated:Date.now(),
  prop:{client:"",contact:"",phone:"",email:"",address:"",pid:"",legal:"",date:today(),investigator:"",weather:"",lat:"",lon:"",gpsAcc:""},
  site:{desc:"",vegetation:[],slope:"",aspect:"",position:"",drainage:"",surfaceWater:"",climate:"",encumbrances:"",services:"",boundaries:"",proposedArea:"",existing:"",notes:""},
  pits:[newPit(1)],
  perm:{air:"20",idIn:"4",auger:"7",holeDepth:"40",finDia:"8",F:"6.6",holes:[newHole(1),newHole(2),newHole(3),newHole(4)]},
  perc:{tests:[{depth:"",t:["","","","","",""]},{depth:"",t:["","","","","",""]},{depth:"",t:["","","","","",""]},{depth:"",t:["","","","","",""]}]},
  setbacks:{da:{},tk:{},na:{},comments:""},
  photos:[],notes:""}}

  Object.assign(s.prop,{client:"Example: J. & R. Morgan",contact:"Jamie Morgan",phone:"604-555-0142",email:"jmorgan@example.com",address:"Example: 4127 Ridgeview Road, Sechelt BC",pid:"012-345-678",legal:"Lot 4, District Lot 1427, Group 1, NWD, Plan 12345",date:today(),investigator:"",weather:"Overcast, light rain previous 24 h",lat:"49.47412",lon:"-123.75361"});
  Object.assign(s.site,{desc:"gently sloping, partially cleared lot with second-growth mixed forest along the east boundary. Proposed dispersal area is a level bench west of the house site.",vegetation:["Mixed forest","Lawn / grass"],slope:"6",aspect:"SW",position:"Mid slope",drainage:"Well drained",surfaceWater:"None observed within 30 m",climate:"Coastal, high winter rainfall",encumbrances:"No covenants on title. BC Hydro ROW along north line.",services:"Water service from the road (municipal). Hydro underground along driveway.",boundaries:"Pins located at NW and SW corners",proposedArea:"West bench, 12 m from house",existing:"None"});
  const p=s.pits[0];Object.assign(p,{location:"Centre of proposed field",depth:"150",wtObserved:"No",shwt:"95",shwtBasis:"Mottles",rlType:"Dense glacial till",rlDepth:"120"});
  p.layers=[Object.assign(newLayer("0"),{to:"25",colour:"Dark brown",texture:"Loam",grade:"2",type:"gr",cons:"VFR",cfPct:"5",cfKind:"Gravel",roots:"Many",moisture:"Moist"}),
            Object.assign(newLayer("25"),{to:"95",colour:"Yellowish brown",texture:"Gravelly sandy loam",grade:"1",type:"sbk",cons:"FR",cfPct:"20",cfKind:"Gravel",roots:"Common",moisture:"Moist"}),
            Object.assign(newLayer("95"),{to:"120",colour:"Light brown",texture:"Gravelly loamy sand",grade:"0",type:"sg",cons:"L",cfPct:"30",cfKind:"Rounded",roots:"Few",mottDepth:"95",mottQty:"Common, fine",moisture:"Moist"}),

  p2.layers=[Object.assign(newLayer("0"),{to:"20",colour:"Dark brown",texture:"Loam",grade:"2",type:"gr",cons:"VFR",cfPct:"5",roots:"Many",moisture:"Moist"}),
             Object.assign(newLayer("20"),{to:"115",colour:"Yellowish brown",texture:"Gravelly sandy loam",grade:"1",type:"sbk",cons:"FR",cfPct:"25",roots:"Common",mottDepth:"100",mottQty:"Few, fine",moisture:"Moist"}),
             Object.assign(newLayer("115"),{to:"140",colour:"Grey",texture:"Sandy loam",grade:"0",type:"m",cons:"VFI",cfPct:"25",roots:"None",moisture:"Moist"})];
  s.pits.push(p2);

  s.perm.holes.forEach((h,i)=>{h.readings=R[i].map(String).concat(["","",""]);h.location=["NW corner of field","NE corner","SW corner","SE corner"][i];h.pit=i<2?"TP1":"TP2"});

let S={sites:[],settings:{company:"",name:"",email:"",phone:"",reg:"",logo:"",format:"xlsx",theme:"",photoGps:"Yes"},ver:1};
let view={name:"home"}; // {name, siteId, pitId, holeId}
let saveT=null;
const dirty=new Set();
function save(){const s=cur();if(s){s.updated=Date.now();dirty.add(s)}clearTimeout(saveT);saveT=setTimeout(flush,350)}
function flush(){dirty.forEach(s=>store.set("site:"+s.id,s));dirty.clear()}
function saveSite(s){return store.set("site:"+s.id,s)}
let metaT=null;function saveMeta(){clearTimeout(metaT);metaT=setTimeout(()=>store.set("meta",{settings:S.settings,ver:2}),250)}

/* ============================================================
   Calculations (mirrors BHC Design Workbook formulas)
   ============================================================ */
const num=v=>{if(v===""||v==null)return NaN;const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:NaN};
const fmt=(v,d=0)=>isFinite(v)?(+v).toFixed(d):"—";
function minOf(arr){const a=arr.filter(isFinite);return a.length?Math.min(...a):NaN}
function pitLimiting(p){const own=num(p.limiting);if(isFinite(own))return own;return minOf([num(p.shwt),num(p.rlDepth),p.wtObserved==="Yes"?num(p.wtDepth):NaN])}
function permArea(perm){const id=num(perm.idIn)*2.54;return 0.3142*Math.pow(id/2,2)} // workbook E13
function holeCalc(perm,h){const r=h.readings.map(num);const rates=r.map((v,i)=>i===0||!isFinite(v)||!isFinite(r[i-1])?NaN:r[i-1]-v);
  const used=rates.filter((v,i)=>isFinite(v)&&!h.excl.includes(i));const avg=used.length?used.reduce((a,b)=>a+b,0)/used.length:NaN;
  const flow=avg*permArea(perm);const kfs=flow*num(perm.F);return{rates,avg,flow,kfs}}
function permSummary(s){const ks=s.perm.holes.map(h=>holeCalc(s.perm,h).kfs).filter(v=>isFinite(v)&&v>0);return{n:ks.length,avg:ks.length?ks.reduce((a,b)=>a+b,0)/ks.length:NaN}}
function percCalc(t){const v=t.t.map(num).filter(isFinite);return v.length?Math.min(...v):NaN}
function percSummary(s){const l=s.perc.tests.map(percCalc).filter(isFinite);return{n:l.length,avg:l.length?l.reduce((a,b)=>a+b,0)/l.length:NaN}}
function sbStatus(s,grp,k,spm){if(s.setbacks.na[grp+"_"+k])return"na";const v=num(s.setbacks[grp][k]);if(!isFinite(v))return"";return v>=spm?"ok":"bad"}
function sbSummary(s){let ok=0,bad=0,blank=0;[["da",SB_DA],["tk",SB_TK]].forEach(([g,L])=>L.forEach(([k,,spm])=>{const st=sbStatus(s,g,k,spm);if(st==="ok"||st==="na")ok++;else if(st==="bad")bad++;else blank++}));return{ok,bad,blank}}
function siteSummary(s){const shwt=minOf(s.pits.map(p=>num(p.shwt)));const rl=minOf(s.pits.map(p=>num(p.rlDepth)));const lim=minOf(s.pits.map(pitLimiting));
  const cf=s.pits.flatMap(p=>p.layers.map(l=>num(l.cfPct))).filter(isFinite);return{pits:s.pits.length,shwt,rl,lim,cfMax:cf.length?Math.max(...cf):NaN,perm:permSummary(s),perc:percSummary(s),sb:sbSummary(s),slope:num(s.site.slope)}}

/* progress per section: [filled, total] */
function prog(s,sec){const f=v=>(Array.isArray(v)?v.length:String(v??"").trim()!=="")?1:0;
  if(sec==="prop"){const k=["client","address","pid","legal","date","investigator"];return[k.reduce((a,x)=>a+f(s.prop[x]),0),k.length]}
  if(sec==="site"){const k=["desc","vegetation","slope","position","drainage","surfaceWater","encumbrances","services"];return[k.reduce((a,x)=>a+f(s.site[x]),0),k.length]}
  if(sec==="pits"){const done=s.pits.filter(p=>p.layers.length&&p.shwt!==""&&p.wtObserved!=="").length;return[done,Math.max(s.pits.length,1)]}
  if(sec==="perm"){return[Math.min(permSummary(s).n,4),4]}
  if(sec==="perc"){const n=percSummary(s).n;return[n?1:0,1]}
  if(sec==="sb"){const x=sbSummary(s);return[x.ok+x.bad,x.ok+x.bad+x.blank]}
  if(sec==="photos"){return[s.photos.length?1:0,1]}
  return[0,1]}

function stepBadge(p){const[a,b]=p;if(b&&a>=b)return`<span class="step done">${IC.check}</span>`;if(a>0)return`<span class="step part">${a}/${b}</span>`;return`<span class="step">${a}/${b}</span>`}
function dot(st){return st===2?`<span class="step done">${IC.check}</span>`:st===1?`<span class="step part">…</span>`:`<span class="step">–</span>`}
function toast(msg){const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

/* field builders: path is relative to current site, e.g. "prop.client" or "pits.<id>.layers.<id>.to" */
function getPath(path){const s=cur();return path.split(".").reduce((o,k)=>{if(o==null)return o;if(Array.isArray(o)){const byId=o.find(x=>x&&x.id===k);return byId!==undefined?byId:o[+k]}return o[k]},s)}
function setPath(path,val){const parts=path.split(".");const last=parts.pop();const parent=getPath(parts.join("."));if(!parent)return;if(Array.isArray(parent))parent[+last]=val;else parent[last]=val;save()}
function inp(path,label,opt={}){const v=getPath(path)??"";const id="f_"+path.replace(/\W/g,"_");const t=opt.type||"text";
  const im=opt.num?` inputmode="decimal"`:"";const unit=opt.unit?` <span class="unit">(${esc(opt.unit)})</span>`:"";
  return`<div class="field">${label?`<label for="${id}">${esc(label)}${unit}</label>`:""}<input id="${id}" type="${t==="number"?"text":t}"${im} data-bind="${esc(path)}" value="${esc(v)}"${opt.ph?` placeholder="${esc(opt.ph)}"`:""}${opt.aria?` aria-label="${esc(opt.aria)}"`:""} autocomplete="off"></div>`}
function area(path,label,opt={}){const v=getPath(path)??"";const id="f_"+path.replace(/\W/g,"_");
  return`<div class="field">${label?`<label for="${id}">${esc(label)}</label>`:""}${opt.hint?`<p class="hint">${opt.hint}</p>`:""}<textarea id="${id}" data-bind="${esc(path)}"${opt.ph?` placeholder="${esc(opt.ph)}"`:""}>${esc(v)}</textarea></div>`}
const OTHER=new Set();const CHIPDEF={};
const OTHER_TXT="Other (type your own)…";
function otherInput(path,label,val,show){return`<input type="text" class="other-in" data-bind="${esc(path)}" value="${esc(val)}" placeholder="Type your own" aria-label="${esc((label||"Value")+" – your own")}" autocomplete="off"${show?"":" hidden"}>`}
function sel(path,label,options,opt={}){const v=getPath(path)??"";const id="f_"+path.replace(/\W/g,"_");
  const vals=(opt.groups?options.flatMap(g=>g[1]):options).map(x=>String(Array.isArray(x)?x[0]:x));
  const allow=!opt.noOther;const isOther=allow&&((String(v)!==""&&!vals.includes(String(v)))||OTHER.has(path));
  let o=`<option value="">${esc(opt.ph||"Choose…")}</option>`;
  const one=x=>{const[val,txt]=Array.isArray(x)?x:[x,x];return`<option value="${esc(val)}"${!isOther&&String(v)===String(val)?" selected":""}>${esc(txt)}</option>`};
  if(opt.groups)o+=options.map(([g,list])=>`<optgroup label="${esc(g)}">${list.map(one).join("")}</optgroup>`).join("");else o+=options.map(one).join("");
  if(allow)o+=`<option value="__other"${isOther?" selected":""}>${OTHER_TXT}</option>`;
  return`<div class="field">${label?`<label for="${id}">${esc(label)}</label>`:""}<select id="${id}" data-bind="${esc(path)}"${allow?' data-hasother="1"':""}>${o}</select>${allow?otherInput(path,label,isOther?v:"",isOther):""}</div>`}
function chips(path,label,options,opt={}){CHIPDEF[path]={label,options,opt};const v=getPath(path);const multi=Array.isArray(v);const allow=!opt.noOther;
  const vals=options.map(x=>String(Array.isArray(x)?x[0]:x));
  const otherPath=multi?path+"Other":path;const otherVal=multi?(getPath(otherPath)??""):(String(v??"")!==""&&!vals.includes(String(v))?v:"");
  const isOther=allow&&(OTHER.has(path)||String(otherVal)!=="");
  const items=options.map(x=>{const[val,txt]=Array.isArray(x)?x:[x,x];const on=multi?v.includes(val):!isOther&&String(v)===String(val);
    const sw=opt.swatch?`<span class="sw" style="background:${opt.swatch(val)}"></span>`:"";
    return`<button type="button" class="chip" data-chip="${esc(path)}" data-val="${esc(val)}" aria-pressed="${on}">${sw}${esc(txt)}</button>`}).join("")
    +(allow?`<button type="button" class="chip" data-chip="${esc(path)}" data-val="__other" aria-pressed="${isOther}">Other…</button>`:"");
  return`<div class="field" data-chipfield="${esc(path)}"><span class="lbl">${esc(label)}${multi?' <span class="unit">(pick any)</span>':""}</span><div class="chips" role="group" aria-label="${esc(label)}">${items}</div>${allow?otherInput(otherPath,label,otherVal,isOther):""}</div>`}
const vegText=s=>[...s.site.vegetation,s.site.vegetationOther].filter(Boolean).join(", ");
const colourHex=n=>(COLOURS.find(c=>c[0]===n)||[0,"transparent"])[1];
const isDark=hex=>{if(!hex||hex[0]!=="#")return false;const n=parseInt(hex.slice(1),16);return((n>>16)*299+((n>>8)&255)*587+(n&255)*114)/1000<120};

function setBar(title,sub,back,right){$("#bar").innerHTML=`${back?`<button class="iconbtn" data-act="back" aria-label="Back">${IC.back}</button>`:""}<h1>${esc(title)}${sub?`<span class="sub">${esc(sub)}</span>`:""}</h1>${right||""}`}
function setActions(html){$("#actions").innerHTML=html?`<div class="actions"><div class="wrap">${html}</div></div>`:""}
function go(v){view=v;render();window.scrollTo(0,0)}
function back(){const v=view;if(v.name==="layer"||v.name==="pit")go(v.name==="layer"?{name:"pit",siteId:v.siteId,pitId:v.pitId}:{name:"pits",siteId:v.siteId});
  else if(v.name==="hole")go({name:"perm",siteId:v.siteId});else if(v.name==="site"||v.name==="settings")go({name:"home"});else if(v.name==="terms")go({name:"settings"});else go({name:"site",siteId:v.siteId})}

function render(){if(!termsAccepted()&&view.name!=="termsgate"){view={name:"termsgate"}}stopTimerIfLeaving();if(MAP&&view.name!=="home"){MAP.remove();MAP=null}const r=VIEWS[view.name]||VIEWS.home;$("#app").innerHTML=r();refreshCalcs();if(view.name==="home")renderDir();if(view.name==="photos")fillThumbs()}

    <div class="fig"><span class="k">Avg K<sub>fs</sub></span><span class="v">${fmt(sum.perm.avg)} <small>mm/d</small></span></div>
    <div class="fig"><span class="k">Setbacks</span><span class="v">${sb.bad?`<span class="pill bad">${sb.bad} short</span>`:sb.blank?`<small>${sb.ok+sb.bad} of ${sb.ok+sb.bad+sb.blank}</small>`:`<span class="pill ok">All OK</span>`}</span></div>

hole(){const s=cur();const P=s.perm;const h=P.holes.find(x=>x.id===view.holeId);if(!h)return VIEWS.perm();const b=`perm.holes.${h.id}`;

perc(){const s=cur();setBar("Percolation tests",s.prop.address,true);setActions(`<button class="btn primary" data-act="back">Done</button>`);
  const tests=s.perc.tests.map((t,i)=>`<div class="layer"><div class="layer-head"><b>Test ${i+1}</b><span class="mono" data-calc="perclow" data-i="${i}"></span></div>

function refreshCalcs(){const s=cur();if(!s)return;
  document.querySelectorAll("[data-calc]").forEach(el=>{const k=el.dataset.calc;
    if(k==="profile"){const p=pitById(s,view.pitId);el.innerHTML=profileSvg(p)}
    else if(k==="pitlim"){const p=pitById(s,view.pitId);el.textContent="Limiting: "+fmt(pitLimiting(p))+" cm"}
    else if(k==="kfsavg"){el.innerHTML=`${fmt(permSummary(s).avg)} <small>mm/d</small>`}
    else if(k==="kfsn"){el.textContent=permSummary(s).n}
    else if(k==="permarea"){el.textContent=`Permeameter area ${fmt(permArea(s.perm),2)} cm²`}
    else if(k==="rate"||k==="havg"||k==="hkfs"){const h=s.perm.holes.find(x=>x.id===view.holeId);if(!h)return;const c=holeCalc(s.perm,h);
      if(k==="rate"){const v=c.rates[+el.dataset.i];el.textContent=isFinite(v)?v.toFixed(1):""}
      if(k==="havg")el.innerHTML=`${fmt(c.avg,2)} <small>mm/min</small>`;if(k==="hkfs")el.innerHTML=`${fmt(c.kfs)} <small>mm/d</small>`}
    else if(k==="perclow"){const v=percCalc(s.perc.tests[+el.dataset.i]);el.textContent=isFinite(v)?`Lowest ${fmt(v,1)} min/in`:""}
    else if(k==="percavg"){el.innerHTML=`${fmt(percSummary(s).avg,1)} <small>min/in</small>`}
    else if(k==="sb"){const st=sbStatus(s,el.dataset.g,el.dataset.k,+el.dataset.spm);
      el.innerHTML=`<button class="pill ${st==="ok"?"ok":st==="bad"?"bad":"na"}" style="border:0" data-act="sbna" data-k="${el.dataset.g}_${el.dataset.k}">${st==="ok"?"OK":st==="bad"?"Short":st==="na"?"N/A":"—"}</button>`}
  })}

function profileSvg(p){if(!p)return"";const depth=Math.max(num(p.depth)||0,...p.layers.map(l=>num(l.to)).filter(isFinite),100);
  const H=Math.min(340,Math.max(200,depth*1.6));const y=d=>(d/depth)*H;
  const lyr=p.layers.map(l=>{const a=num(l.from),b=num(l.to);if(!isFinite(a)||!isFinite(b)||b<=a)return"";const c=colourHex(l.colour);
    return`<div class="lyr ${isDark(c)?"dk":""}" style="top:${y(a)}px;height:${y(b)-y(a)}px;background:${c==="transparent"?"var(--surface)":c}">${b-a>=12?esc((l.texture||"").split(" ").map(w=>w[0]).join("").toUpperCase()):""}</div>`}).join("");
  const m=[];if(isFinite(num(p.shwt)))m.push(`<div class="mark" style="top:${y(num(p.shwt))}px" title="SHWT"></div>`);
  if(p.wtObserved==="Yes"&&isFinite(num(p.wtDepth)))m.push(`<div class="mark" style="top:${y(num(p.wtDepth))}px;border-top-style:solid"></div>`);
  if(isFinite(num(p.rlDepth)))m.push(`<div class="mark rl" style="top:${y(num(p.rlDepth))}px"></div>`);
  const ticks=[];const step=depth>200?50:25;for(let d=0;d<=depth;d+=step)ticks.push(`<span style="position:absolute;top:${y(d)-7}px;right:0">${d}</span>`);
  return`<div style="display:grid;grid-template-columns:30px 1fr;gap:6px" role="img" aria-label="Soil profile diagram for ${esc(p.name)}"><div class="ticks" style="height:${H}px">${ticks.join("")}</div><div class="profile" style="height:${H}px">${lyr}${m.join("")}</div></div>`}

  const close=()=>$("#overlay").innerHTML="";$("#sh_no").onclick=close;$("#sh_ok").onclick=()=>{close();onOk()};$(".sheet-bg").onclick=e=>{if(e.target.dataset.close)close()};$("#sh_ok").focus()}

/* GPS */
function getGps(){const s=cur();const hint=document.querySelector('[data-calc="gpsacc"]');
  if(!navigator.geolocation){hint.textContent="Location isn't available on this device. Type the coordinates instead.";return}
  hint.textContent="Getting your location…";
  navigator.geolocation.getCurrentPosition(pos=>{s.prop.lat=pos.coords.latitude.toFixed(6);s.prop.lon=pos.coords.longitude.toFixed(6);s.prop.gpsAcc=Math.round(pos.coords.accuracy);save();render();toast("Location saved")},
    err=>{hint.textContent=err.code===1?"Location permission was refused. Allow location for this app in your phone settings, or type the coordinates.":"Couldn't get a location fix. Try again in the open, or type the coordinates."},{enableHighAccuracy:true,timeout:20000,maximumAge:0})}

/* Permeability minute timer */
let timer=null;
function toggleTimer(){const btn=$("#timerbtn");if(timer){clearInterval(timer.int);timer=null;btn.innerHTML=IC.timer+" Start timer";return}
  const t0=Date.now();let lastMin=0;timer={int:setInterval(()=>{const sec=Math.floor((Date.now()-t0)/1000);const c=$("#clock");if(c)c.textContent=Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0");
    const m=Math.floor(sec/60);if(m>lastMin){lastMin=m;try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}beep();const f=document.querySelector(`tr[data-row="${m}"] input`);if(f){f.focus();f.scrollIntoView({block:"center"})}}},250)};
  btn.innerHTML="Stop timer";try{const f=document.querySelector('tr[data-row="0"] input');f&&f.focus()}catch(e){}}
function stopTimerIfLeaving(){if(timer&&view.name!=="hole"){clearInterval(timer.int);timer=null}}
let actx=null;function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+.25)}catch(e){}}

/* Photos */
const THUMBS=new Map();
async function fillThumbs(){for(const img of document.querySelectorAll("img[data-thumb]")){if(img.getAttribute("src"))continue;const id=img.dataset.thumb;let d=THUMBS.get(id);if(!d){d=await store.get("th:"+id)||await store.get("ph:"+id);if(d)THUMBS.set(id,d)}if(d)img.src=d}}
async function withPhotos(s){if(!s.photos.length||s.photos.every(p=>p.data))return s;const photos=await Promise.all(s.photos.map(async p=>({...p,data:p.data||await store.get("ph:"+p.id)||THUMBS.get(p.id)||await store.get("th:"+p.id)})));return{...s,photos:photos.filter(p=>p.data)}}
function resizeImage(file,max,q,type="image/jpeg"){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);const x=c.getContext("2d");if(type==="image/jpeg"){x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height)}x.drawImage(img,0,0,c.width,c.height);res(c.toDataURL(type,q))};img.onerror=rej;img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
function parseExif(buf){try{const d=new DataView(buf);if(d.getUint16(0)!==0xFFD8)return null;let o=2;
  while(o<d.byteLength-4){const m=d.getUint16(o);if((m&0xFF00)!==0xFF00)return null;if(m===0xFFE1&&d.getUint32(o+4)===0x45786966)return readTiff(d,o+10);o+=2+d.getUint16(o+2)}}catch(e){}return null}
function readTiff(d,t){const le=d.getUint16(t)===0x4949;const u16=p=>d.getUint16(p,le),u32=p=>d.getUint32(p,le);
  const ifd=off=>{const n=u16(t+off);const g={};for(let i=0;i<n;i++){const e=t+off+2+i*12;g[u16(e)]={count:u32(e+4),vo:e+8}}return g};
  const rat=p=>u32(p)/u32(p+4);const str=g=>{const p=g.count>4?t+u32(g.vo):g.vo;let s="";for(let i=0;i<g.count-1;i++)s+=String.fromCharCode(d.getUint8(p+i));return s};
  const out={};const i0=ifd(u32(t+4));
  if(i0[0x8769]){const ex=ifd(u32(i0[0x8769].vo));const tg=ex[0x9003]||ex[0x9004];if(tg){const m=str(tg).match(/(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d)/);if(m)out.time=`${m[1]}-${m[2]}-${m[3]} ${m[4]}:${m[5]}`}}
  if(i0[0x8825]){const g=ifd(u32(i0[0x8825].vo));const dms=x=>{const p=t+u32(x.vo);return rat(p)+rat(p+8)/60+rat(p+16)/3600};
    if(g[2]&&g[4]){let la=dms(g[2]),lo=dms(g[4]);if(g[1]&&String.fromCharCode(d.getUint8(g[1].vo))==="S")la=-la;if(g[3]&&String.fromCharCode(d.getUint8(g[3].vo))==="W")lo=-lo;if(isFinite(la)&&isFinite(lo)&&(la||lo)){out.lat=la;out.lon=lo}}}
  return out}
function currentPos(){return new Promise(res=>{if(!navigator.geolocation)return res(null);let done=false;const fin=v=>{if(!done){done=true;res(v)}};setTimeout(()=>fin(null),15000);
  try{navigator.geolocation.getCurrentPosition(p=>fin(p.coords),()=>fin(null),{enableHighAccuracy:true,timeout:14000,maximumAge:60000})}catch(e){fin(null)}})}
const localStamp=d=>{const z=n=>String(n).padStart(2,"0");return`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`};
function photoGeo(ph){const parts=[];if(isFinite(ph.lat)&&ph.lat!==null&&ph.lat!=="")parts.push(`${(+ph.lat).toFixed(6)}, ${(+ph.lon).toFixed(6)}${ph.acc?" ±"+ph.acc+" m":""}`);if(ph.time)parts.push(ph.time);return parts.join(" · ")}
function photoCaption(ph,i){const base=`Photo ${i+1}${ph.pit?" ("+ph.pit+")":""}: ${ph.caption||""}`.trim();const g=photoGeo(ph);return S.settings.photoGps!=="No"&&g?`${base}  [${g}]`:base}
async function addPhotos(files){const s=cur();const list=[...files];if(!list.length)return;toast("Adding photo…");const posP=currentPos();
  for(const f of list){try{let ex=null;try{ex=parseExif(await f.slice(0,262144).arrayBuffer())}catch(e){}
    const d=await resizeImage(f,1600,0.78);const im=new Image();await new Promise(r=>{im.onload=r;im.src=d});
    const th=await resizeImage(f,360,0.72);const ph={id:uid(),w:im.width,h:im.height,caption:"",pit:"",lat:"",lon:"",acc:"",time:(ex&&ex.time)||localStamp(new Date()),gpsSrc:""};
    if(ex&&isFinite(ex.lat)){ph.lat=+ex.lat.toFixed(6);ph.lon=+ex.lon.toFixed(6);ph.gpsSrc="photo"}
    else{const c=await posP;if(c){ph.lat=+c.latitude.toFixed(6);ph.lon=+c.longitude.toFixed(6);ph.acc=Math.round(c.accuracy);ph.gpsSrc="phone"}}
    await store.set("ph:"+ph.id,d);await store.set("th:"+ph.id,th);THUMBS.set(ph.id,th);s.photos.push(ph)}catch(e){toast("That file couldn't be read as a photo")}}

const STATUSES=["In progress","Sent","Complete"];
let DIR={q:"",sort:"recent",status:"All",mode:"list"};try{DIR.mode=localStorage.getItem("ssfl_dirmode")||"list"}catch(e){}
let MAP=null;
const norm=x=>String(x??"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function siteHay(s){const p=s.prop;return norm([p.address,p.client,p.contact,p.pid,p.legal,p.fileNo,p.date,p.investigator,p.email,p.phone,s.notes,s.site.proposedArea,s.status].join(" "))}
function dirFiltered(){const words=norm(DIR.q).split(/\s+/).filter(Boolean);
  let L=S.sites.filter(s=>(DIR.status==="All"||(s.status||"In progress")===DIR.status)&&words.every(w=>siteHay(s).includes(w)));
  const by={recent:(a,b)=>b.updated-a.updated,date:(a,b)=>String(b.prop.date).localeCompare(String(a.prop.date)),address:(a,b)=>norm(a.prop.address.replace(/^example:\s*/i,"")).localeCompare(norm(b.prop.address.replace(/^example:\s*/i,""))),client:(a,b)=>norm(a.prop.client).localeCompare(norm(b.prop.client))}[DIR.sort];
  return L.sort(by)}
function siteRow(s){const sum=siteSummary(s);const st=s.status||"In progress";
  const sub=[s.prop.client.replace(/^Example:\s*/,""),s.prop.date||"No date",s.prop.fileNo&&"#"+s.prop.fileNo,isFinite(sum.lim)&&"limiting "+fmt(sum.lim)+" cm"].filter(Boolean).join(" · ");
  return`<button class="navitem" data-act="open" data-id="${s.id}"><div class="t"><b>${esc(s.prop.address||"Untitled site")}</b><span>${esc(sub)}</span></div>${s.example?'<span class="pill ex">Example</span>':st==="Sent"?'<span class="pill sent">Sent</span>':st==="Complete"?'<span class="pill ok">Complete</span>':""}${IC.chev}</button>`}
function renderDir(){const box=$("#dirlist");if(!box)return;const L=dirFiltered();const total=S.sites.length;
  const counts={All:total};STATUSES.forEach(x=>counts[x]=S.sites.filter(s=>(s.status||"In progress")===x).length);
  $("#dirstat").innerHTML=["All",...STATUSES].map(x=>`<button class="chip" data-act="dirstatus" data-val="${x}" aria-pressed="${DIR.status===x}">${x} <span class="unit">${counts[x]}</span></button>`).join("");
  const countTxt=L.length===total?`${total} site${total===1?"":"s"}`:`${L.length} of ${total} sites match`;
  if(DIR.mode==="map"){const noGps=L.filter(s=>!isFinite(num(s.prop.lat))||!isFinite(num(s.prop.lon))).length;
    if(MAP){MAP.remove();MAP=null}
    box.innerHTML=`<div class="dircount"><span>${countTxt}${noGps?` · ${noGps} without a GPS point`:""}</span></div><div class="row" style="gap:8px"><button class="btn sm" data-act="nearme">${IC.pin} Near me</button><button class="btn sm" data-act="kml">Google Earth file (.kml)</button></div>
      <div id="map" role="region" aria-label="Map of sites"></div><p class="hint" id="mapnote" aria-live="polite"></p>`;

  let html="",yr=null;const group=DIR.sort==="date"||DIR.sort==="recent";const shown=L.slice(0,DIR.limit||150);

    grid(["Feature","SPM min. (m)","This project (m)","OK?"],L.map(([k,name,spm])=>{const x=sbStatus(s,g,k,spm);return[name,spm,s.setbacks.na[g+"_"+k]?"N/A":nv(s.setbacks[g][k]),x==="ok"?"OK":x==="bad"?"NO":x==="na"?"N/A":""]}),
      {size:8.5,cols:{0:{halign:"left"}},cell:d=>{if(d.section==="body"&&d.column.index===3){d.cell.styles.fontStyle="bold";if(d.cell.raw==="NO")d.cell.styles.textColor=[176,40,31];if(d.cell.raw==="OK")d.cell.styles.textColor=[43,122,75]}}})});
  if(s.setbacks.comments)para("Comments: "+s.setbacks.comments,{size:8.5});

  /* Photos: two per page */
  if(s.photos.length){title("Site Photographs","portrait");const maxW=W()-2*M,maxH=(Hh()-y-30)/2-10;
    s.photos.forEach((ph,i)=>{const r=(ph.w||4)/(ph.h||3);let w=maxW,h=w/r;if(h>maxH){h=maxH;w=h*r}
      const capLines=doc.splitTextToSize(photoCaption(ph,i),maxW);if(y+h+capLines.length*4+6>Hh()-18){doc.addPage("letter","portrait");y=M+4}
      try{doc.addImage(ph.data,"JPEG",M+(maxW-w)/2,y,w,h)}catch(e){}y+=h+4;
      doc.setFont("helvetica","italic");doc.setFontSize(8.5);doc.setTextColor(...GREY);doc.text(capLines,W()/2,y+1,{align:"center"});y+=capLines.length*4+8})}

  /* Footers */
  const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont("helvetica","normal");doc.setFontSize(7.5);doc.setTextColor(...GREY);
    doc.text(`${st.company?st.company+"  ·  ":""}${addr}`,M,Hh()-9);doc.text(`Page ${i} of ${n}`,W()-M,Hh()-9,{align:"right"})}
  doc.setProperties({title:fileBase(s),creator:st.name||"Site & Soil Field Log"});
  return doc.output("blob")}

/* ============================================================
   Export – deliver the file (share sheet → email, else save)
   ============================================================ */
async function deliverFile(blob,name,status,text,to=""){const file=new File([blob],name,{type:blob.type});let done=false;
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name,text});status.textContent="Sent to your share menu. Pick Mail, check the address and tap Send.";done=true}catch(e){if(e&&e.name==="AbortError"){status.textContent="Share cancelled. Tap the button again when you're ready.";done=true}}}
  if(!done&&window.claude&&window.claude.use){const dl=await window.claude.use("downloads");if(dl){try{await dl.save({filename:name,data:blob});status.textContent=`Saved “${name}”.${to?" Attach it to an email to "+to+".":""}`;done=true}catch(e){status.textContent="The save was cancelled.";done=true}}}
  if(!done){const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);status.textContent=`Downloaded “${name}”.${to?" Attach it to an email to "+to+".":""}`}}
async function doExport(){const s=cur();const btn=$("#dobtn");const status=$("#exstatus");const fmtSel=S.settings.format||"xlsx";
  btn.disabled=true;status.textContent="Building your file…";
  try{const blob=fmtSel==="docx"?await buildDocx(s):fmtSel==="pdf"?await buildPdf(s):await buildXlsx(s);const name=fileBase(s)+"."+fmtSel;
    if(fmtSel){s.sentAt=localStamp(new Date()).slice(0,10);if(!s.status||s.status==="In progress")s.status="Sent";save()}
    const to=($("#sendto")||{}).value||S.settings.email||"";
    await deliverFile(blob,name,status,`Site and soil field log for ${s.prop.address||"site"}${to?" – send to "+to:""}`,to);
  }catch(e){status.textContent=e.message||"Something went wrong building the file. Try again."}
  btn.disabled=false}

(async function boot(){const DEF={company:"",name:"",email:"",phone:"",reg:"",logo:"",format:"xlsx",theme:"",photoGps:"Yes"};
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  let meta=await store.get("meta");
  if(!meta){const old=await store.get("state");
    if(old&&old.sites){/* move v0.1/0.2 single-record storage to one record per site, photos stored separately */
      for(const s of old.sites){for(const p of s.photos||[]){if(p.data){await store.set("ph:"+p.id,p.data);try{const th=await resizeDataUrl(p.data,360,0.72);await store.set("th:"+p.id,th)}catch(e){}delete p.data}}await saveSite(s)}
      if(old.sites.every(s=>s.example))for(const s of moreExamples())await saveSite(s);
      meta={settings:Object.assign({},DEF,old.settings||{}),ver:2};await store.set("meta",meta);await store.del("state")}
    else{for(const s of [exampleSite(),...moreExamples()])await saveSite(s);meta={settings:DEF,ver:2};await store.set("meta",meta)}}
  S.settings=Object.assign({},DEF,meta.settings||{});S.sites=(await store.getPrefix("site:")).filter(x=>x&&x.id);
  if(!S.sites.length&&!(await store.get("meta"))){/* storage unavailable (private window): keep examples in memory */S.sites=[exampleSite(),...moreExamples()]}
  applyTheme();render()})();
function resizeDataUrl(d,max,q){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",q))};img.onerror=rej;img.src=d})}
