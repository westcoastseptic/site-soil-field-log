<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Site &amp; Soil Field Log</title>
<meta name="description" content="A free field tool from West Coast Septic: record a site and soil evaluation and export it to Excel, Word or PDF.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#508EB9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Site &amp; Soil">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{color-scheme:light dark}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bayon&family=Open+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column field clipboard. West Coast Septic brand: Blue 2 bar, Bayon titles, Open Sans body, low-poly water drop on white. */
:root{
  --bg:#F2F7F9; --surface:#FFFFFF; --sunk:#F6FAFB; --ink:#1D2A33; --muted:#5A6B77; --line:#D3E3EA;
  --accent:#508EB9; --accent-text:#3A7099; --accent-soft:#E2EFF5; --accent-ink:#FFFFFF;
  --b1:#4B85C4; --b2:#508EB9; --b3:#5FA9CF; --b4:#72ACC9; --b5:#9ACFD5; --b6:#C1E1EA;
  --ok:#2B7A4B; --ok-soft:#DFF1E6; --bad:#B0281F; --bad-soft:#F8E1DE; --warn:#8E6200; --warn-soft:#F6ECD3;
  --water:#4B85C4;
  --f-display:"Bayon","Oswald","Arial Narrow",Impact,sans-serif;
  --f-body:"Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"Open Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px; --drop-op:.5; --bar:#508EB9; --bar-ink:#FFFFFF;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D171E; --surface:#14222C; --sunk:#101C25; --ink:#E2EDF2; --muted:#93A9B6; --line:#243747;
  --accent:#72ACC9; --accent-text:#9ACFD5; --accent-soft:#183243; --accent-ink:#0A1620;
  --ok:#6FCF97; --ok-soft:#173826; --bad:#F2877D; --bad-soft:#3E1C19; --warn:#E3B54E; --warn-soft:#3A2E12;
  --water:#9ACFD5; --drop-op:0; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D171E; --surface:#14222C; --sunk:#101C25; --ink:#E2EDF2; --muted:#93A9B6; --line:#243747;
  --accent:#72ACC9; --accent-text:#9ACFD5; --accent-soft:#183243; --accent-ink:#0A1620;
  --ok:#6FCF97; --ok-soft:#173826; --bad:#F2877D; --bad-soft:#3E1C19; --warn:#E3B54E; --warn-soft:#3A2E12;
  --water:#9ACFD5; --drop-op:0; color-scheme:dark }
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--bar-ink)}
.bar .wrap{display:flex;align-items:center;gap:8px;min-height:58px;padding-block:6px}
.bar h1{font-family:var(--f-display);font-weight:400;font-size:25px;line-height:1.1;letter-spacing:.05em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar h1.long{font-size:21px}
.bar .sub{display:block;font-family:var(--f-body);font-weight:500;font-size:13px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:inherit;flex:none}
.iconbtn:active{background:rgba(255,255,255,.18)}
.iconbtn svg{width:24px;height:24px}

main.wrap{padding-block:16px 120px;display:flex;flex-direction:column;gap:16px}

/* Generic blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.card h2{font-family:var(--f-display);font-size:23px;font-weight:400;margin:0;letter-spacing:.05em;color:var(--accent-text);text-wrap:balance}
.card h3{font-family:var(--f-display);font-size:23px;font-weight:400;margin:0;letter-spacing:.05em;color:var(--accent-text)}
.hint{color:var(--muted);font-size:15px;margin:0}
.eyebrow{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 140px;min-width:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Fields */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lbl{font-weight:600;font-size:15px}
.field .unit{font-weight:400;color:var(--muted)}
input[type=text],input[type=search],input[type=tel],input[type=email],input[type=date],input[type=number],input:not([type]),select,textarea{
  width:100%;min-height:50px;border:1.5px solid var(--line);border-radius:8px;background:var(--sunk);padding:10px 12px;font-size:17px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);background:var(--surface);outline:none}
textarea{min-height:96px;resize:vertical}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:8px 14px;border-radius:22px;border:1.5px solid var(--line);background:var(--sunk);font-size:16px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.chip .sw{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;margin-right:6px;border:1px solid rgba(0,0,0,.25)}

.other-in{margin-top:2px}
/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 18px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:18px;text-align:center}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:44px;padding:6px 14px;font-size:15px}
.btn:disabled{opacity:.5}

/* Lists of navigable things */
.navlist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.navitem{display:flex;align-items:center;gap:14px;padding:14px 16px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;width:100%;min-height:68px}
.navitem:first-child{border-top:0}
.navitem:active{background:var(--sunk)}
.navitem .t{flex:1;min-width:0}
.navitem .t b{display:block;font-size:18px;font-weight:600}
.navitem .t span{display:block;color:var(--muted);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navitem .chev{width:20px;height:20px;color:var(--muted);flex:none}
.step{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:14px;font-weight:500;border:1.5px solid var(--line);color:var(--muted)}
.step.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.step.part{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.step svg{width:18px;height:18px}

.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:12px;font-size:14px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.na{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.pill.ex{background:var(--warn-soft);color:var(--warn)}

/* Summary figures */
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.fig{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.fig .k{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.fig .v{font-family:var(--f-mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.fig .v small{font-size:14px;color:var(--muted);font-family:var(--f-body)}

/* Soil profile strip */
.pitwrap{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:start}
.profile{position:relative;border:1.5px solid var(--ink);border-radius:4px;overflow:hidden;background:repeating-linear-gradient(135deg,var(--sunk) 0 6px,var(--line) 6px 7px)}
.profile .lyr{position:absolute;left:0;right:0;border-top:1px solid rgba(0,0,0,.35);font-family:var(--f-mono);font-size:11px;padding:2px 4px;color:#111;overflow:hidden}
.profile .lyr.dk{color:#F3F3F3}
.profile .mark{position:absolute;left:-2px;right:-2px;height:0;border-top:2.5px dashed var(--water)}
.profile .mark.rl{border-top:2.5px solid var(--bad)}
.ticks{position:relative;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.legend{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.legend i{display:inline-block;width:22px;vertical-align:middle;margin-right:6px}
@media (max-width:420px){.pitwrap{grid-template-columns:80px 1fr}}

/* Layer cards */
.layer{border:1.5px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--sunk)}
.layer-head{display:flex;align-items:center;gap:10px}
.layer-head .swatch{width:28px;height:28px;border-radius:6px;border:1px solid rgba(0,0,0,.3);flex:none}
.layer-head b{flex:1;font-family:var(--f-mono);font-weight:500;font-size:16px}

/* Permeability readings */
.readings{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.readings th{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:6px 4px;font-weight:600}
.readings td{padding:4px;border-top:1px solid var(--line);vertical-align:middle}
.readings td.min{font-family:var(--f-mono);width:56px;color:var(--muted)}
.readings td.rate{font-family:var(--f-mono);width:92px;text-align:right}
.readings td.use{width:56px;text-align:right}
.readings tr.excl td.rate{text-decoration:line-through;color:var(--muted)}
.readings input{min-height:46px}
.tog{min-width:46px;min-height:40px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-size:13px;font-weight:600}
.tog[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text)}
.timer{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r);background:var(--accent-soft)}
.timer .clock{font-family:var(--f-mono);font-size:28px;font-weight:500;flex:1}

/* Setbacks */
.sb{display:grid;grid-template-columns:1fr 104px 68px;gap:8px 10px;align-items:center}
.sb .name{font-size:16px;line-height:1.25;min-width:0}
.sb .name small{display:block;color:var(--muted);font-family:var(--f-mono);font-size:13px}
.sb input{min-height:46px;text-align:right}
.sb .st{text-align:right}
.sb .hdr{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.sb .hdr.r{text-align:right}

/* Photos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.photo{display:flex;flex-direction:column;gap:6px;min-width:0}
.photo img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid var(--line);max-width:100%}
.photo input{min-height:44px;font-size:15px}

/* Bottom action bar */
.actions{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.actions .wrap{display:flex;gap:10px;padding-block:10px 0}
.actions .wrap>*{flex:1}

/* Toast & sheet */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:22px;font-weight:600;font-size:15px;z-index:20;max-width:calc(100% - 32px);text-align:center}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet h2{font-family:var(--f-display);font-weight:400;letter-spacing:.05em;margin:0;font-size:24px}

.terms-box{max-height:46vh;overflow:auto;border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--sunk);font-size:14px;line-height:1.5}
.terms-box h4{font-family:var(--f-body);font-size:15px;margin:14px 0 4px}
.terms-box p{margin:0 0 8px}
.terms-sum{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.agree{display:flex;gap:12px;align-items:flex-start;font-size:16px;line-height:1.35;cursor:pointer}
.agree input{width:26px;height:26px;flex:none;margin-top:1px;accent-color:var(--accent)}
.note{border-left:4px solid var(--warn);background:var(--warn-soft);padding:10px 12px;border-radius:6px;font-size:15px}
.note+.note{margin-top:8px}
.foot{color:var(--muted);font-size:13px;text-align:center;padding-top:8px}
.home-hero{position:relative;display:flex;flex-direction:column;gap:6px;padding:18px 16px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.home-hero>*{position:relative;z-index:1}
.home-hero .facets{position:absolute;z-index:0;right:-14px;top:50%;transform:translateY(-38%);height:138%;width:auto;opacity:.5;pointer-events:none}
.byline{display:flex;align-items:center;gap:10px;margin-top:8px;padding-top:12px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;letter-spacing:.02em}
.wcslogo{display:inline-flex;line-height:0}.wcslogo img{width:auto;display:block}
.wcs-dark{display:none!important}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .wcs-light{display:none!important}:root:not([data-theme="light"]) .wcs-dark{display:block!important}:root:not([data-theme="light"]) .home-hero .facets{opacity:.28}}
:root[data-theme="dark"] .wcs-light{display:none!important}:root[data-theme="dark"] .wcs-dark{display:block!important}:root[data-theme="dark"] .home-hero .facets{opacity:.28}
.gatebrand{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0 2px;text-align:center}
.gatebrand .app{font-family:var(--f-display);font-size:22px;letter-spacing:.05em;color:var(--accent-text)}
.about{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.contactbtns{display:flex;flex-direction:column;gap:8px;align-self:stretch}.contactbtns .btn{text-decoration:none;justify-content:center;color:var(--accent-text)}.byline a{line-height:0}
.gpsbox{display:flex;flex-direction:column;gap:8px}
.linkphotos{display:flex;flex-direction:column;gap:10px}
.photos.sm{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.home-hero h2{font-family:var(--f-display);font-weight:400;font-size:clamp(24px,8vw,34px);line-height:1.05;letter-spacing:.04em;margin:0;color:var(--accent-text);white-space:nowrap}
.linkbtn{border:0;background:none;padding:6px 2px;min-height:36px;color:var(--accent-text);font-weight:600;font-size:15px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.dirtools{gap:10px}
.home-hero .brandlogo{max-height:56px;max-width:220px;width:auto;align-self:flex-start;margin-bottom:6px}
.home-hero p{margin:0;color:var(--muted)}
.center{text-align:center}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .18s ease-out}@keyframes pop{from{transform:translate(-50%,8px);opacity:.2}}}

.dirbar{display:flex;flex-direction:column;gap:10px}
.searchrow{display:flex;gap:8px}
.searchrow input{flex:1;min-width:0}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.seg button{min-height:48px;padding:0 14px;border:0;background:var(--surface);font-weight:600;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.dircount{color:var(--muted);font-size:14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.yearhd{font-family:var(--f-display);font-size:20px;letter-spacing:.05em;color:var(--accent-text);margin:6px 2px -6px}
#map{height:62vh;min-height:320px;border-radius:var(--r);border:1px solid var(--line);background:var(--sunk);z-index:0}
.leaflet-popup-content{font-family:var(--f-body);font-size:14px;margin:12px 14px;min-width:180px}
.leaflet-popup-content b{display:block;font-size:15px;margin-bottom:2px}
.leaflet-popup-content .btn{margin-top:8px;width:100%;min-height:42px;font-size:15px}
.leaflet-container{font-family:var(--f-body)}
.pill.sent{background:var(--accent-soft);color:var(--accent-text)}



/* v0.35 polish */
.actions{background:color-mix(in srgb,var(--surface) 72%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);border-top-color:color-mix(in srgb,var(--line) 70%,transparent)}
.linkdanger{background:none;border:0;color:var(--bad);font:inherit;font-size:15px;font-weight:500;text-decoration:underline;text-underline-offset:3px;min-height:48px;padding:0 6px;cursor:pointer;align-self:center}
.linkdanger:disabled{opacity:.6}
@keyframes pgIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes pgBack{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
#app.pg-in{animation:pgIn .24s cubic-bezier(.2,.75,.25,1)}
#app.pg-back{animation:pgBack .24s cubic-bezier(.2,.75,.25,1)}
.card .navlist{border-left:0;border-right:0;border-radius:0;margin-inline:-16px;background:transparent}
.card .navlist:last-child{border-bottom:0;margin-bottom:-16px;border-radius:0 0 var(--r) var(--r)}
#splash{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);transition:opacity .35s ease,visibility .35s}
#splash img{width:74px;height:auto;animation:spPulse 1.4s ease-in-out infinite}
#splash .t{font-family:var(--f-display),Impact,sans-serif;font-size:26px;letter-spacing:.05em;color:var(--accent-text)}
#splash .b{font-size:13px;color:var(--muted);letter-spacing:.04em}
#splash.gone{opacity:0;visibility:hidden}
@keyframes spPulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){#app.pg-in,#app.pg-back,#splash img{animation:none}}
</style>

const store=(()=>{let dbp=null;function open(){if(dbp)return dbp;dbp=new Promise((res,rej)=>{try{const r=indexedDB.open("ssfl",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return dbp}
  async function get(k){try{const db=await open();return await new Promise((res,rej)=>{const t=db.transaction("kv").objectStore("kv").get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error)})}catch(e){return undefined}}
  async function set(k,v){try{const db=await open();await new Promise((res,rej)=>{const t=db.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)});return true}catch(e){return false}}
  async function del(k){try{const db=await open();await new Promise((res,rej)=>{const t=db.transaction("kv","readwrite");t.objectStore("kv").delete(k);t.oncomplete=res;t.onerror=()=>rej(t.error)});return true}catch(e){return false}}
  async function getPrefix(pre){try{const db=await open();return await new Promise((res,rej)=>{const t=db.transaction("kv").objectStore("kv").getAll(IDBKeyRange.bound(pre,pre+"\uffff"));t.onsuccess=()=>res(t.result||[]);t.onerror=()=>rej(t.error)})}catch(e){return[]}}
  return{get,set,del,getPrefix}})();

/* ============================================================

const num=v=>{if(v===""||v==null)return NaN;const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:NaN};
const fmt=(v,d=0)=>isFinite(v)?(+v).toFixed(d):"—";
function minOf(arr){const a=arr.filter(isFinite);return a.length?Math.min(...a):NaN}
function pitLimiting(p){const own=num(p.limiting);if(isFinite(own))return own;return minOf([num(p.shwt),num(p.rlDepth),p.wtObserved==="Yes"?num(p.wtDepth):NaN])}
/* SPM v3 Vol III p.A11 (Table III-21): volume conversion factor = 0.3142 x R² (R in cm). 0.3142 = π/10, so this is the reservoir area in cm² ÷ 10 (mm of fall -> cm). Q (mL/min) = rate of fall (mm/min) x factor. Not the area itself: a 4 in tube has area 81.07 cm² and factor 8.11. */
function permArea(perm){const id=num(perm.idIn)*2.54;return 0.3142*Math.pow(id/2,2)}
function median(a){a=a.filter(isFinite).slice().sort((x,y)=>x-y);if(!a.length)return NaN;const m=a.length>>1;return a.length%2?a[m]:(a[m-1]+a[m])/2}
function permSoil(perm){return perm.soil||({"8.1":"coarse","4.1":"massive"}[String(perm.F)]||"fine")}
/* F from the SPM chart; linear between chart columns, clamped to 7–22 cm */
function permFinfo(perm){const soil=permSoil(perm);const row=F_TABLE[soil];let d=num(perm.finDia);const known=isFinite(d)&&d>0;if(!known)d=8;
  const dd=Math.min(22,Math.max(7,d));let F=row[0];for(let i=0;i<F_DIA.length;i++){if(dd===F_DIA[i]){F=row[i];break}if(i<F_DIA.length-1&&dd>F_DIA[i]&&dd<F_DIA[i+1]){const k=(dd-F_DIA[i])/(F_DIA[i+1]-F_DIA[i]);F=row[i]+k*(row[i+1]-row[i]);break}}
  F=Math.round(F*100)/100;return{F,soil,soilLabel:(SOIL_TYPES.find(x=>x[0]===soil)||["",""])[1],dia:known?d:NaN,outside:known&&(d<7||d>22),interp:!F_DIA.includes(dd)}}

/* Stable rate of fall = median of the last 3 readings not skipped (SPM A10: final stable rate; stable = 3 consecutive nearly equal) */
function holeCalc(perm,h){const r=h.readings.map(num);const rates=r.map((v,i)=>i===0||!isFinite(v)||!isFinite(r[i-1])?NaN:r[i-1]-v);
  const cand=[];rates.forEach((v,i)=>{if(isFinite(v)&&!h.excl.includes(i))cand.push(i)});const last=cand.slice(-3);const usedIdx=new Set(last);
  const lv=last.map(i=>rates[i]);const avg=median(lv);
  const stable=lv.length===3&&isFinite(avg)&&avg>0&&lv.every(v=>Math.abs(v-avg)<=0.25*avg);
  const flow=avg*permArea(perm);const kfs=flow*permF(perm);return{rates,avg,flow,kfs,usedIdx,stable,nUsed:lv.length}}
function permSummary(s){const ks=s.perm.holes.map(h=>holeCalc(s.perm,h).kfs).filter(v=>isFinite(v)&&v>=0);return{n:ks.length,avg:median(ks),mean:ks.length?ks.reduce((a,b)=>a+b,0)/ks.length:NaN,min:ks.length?Math.min(...ks):NaN,max:ks.length?Math.max(...ks):NaN}}
/* Perc: report the slowest rate (highest min/in) for each hole (SPM A6 step 12); sizing rate = median (A7) */
function percCalc(t){const v=t.t.map(num).filter(isFinite);return v.length?Math.max(...v):NaN}
function percStable(t){const v=t.t.map(num).filter(isFinite);if(v.length<2)return null;const a=v[v.length-2],b=v[v.length-1];return Math.abs(b-a)<=Math.min(2,0.1*Math.max(a,b))}
function percSummary(s){const l=s.perc.tests.map(percCalc).filter(isFinite);return{n:l.length,avg:median(l),min:l.length?Math.min(...l):NaN,max:l.length?Math.max(...l):NaN}}
/* SPM checks shown as warnings */
function holeRl(s,h){const p=h.pit&&s.pits.find(x=>x.name===h.pit);const v=p?num(p.rlDepth):NaN;return isFinite(v)?v:minOf(s.pits.map(x=>num(x.rlDepth)))}
function holeWarn(s,h){const W=[];const c=holeCalc(s.perm,h);
  if(h.readings.some(r=>r!=="")){if(c.nUsed<3)W.push("Needs at least 3 readings to show a stable rate of fall.");else if(!c.stable&&c.avg>0)W.push("Not stable yet: the last 3 readings differ by more than 25%. Keep taking readings until three in a row are nearly equal (SPM A10).")}
  if(c.nUsed&&c.avg===0)W.push("No measurable drop. The SPM says to report Kfs as less than 10 mm/day, and to re-test with a smaller permeameter, a larger hole or at another depth or spot (A11). This borehole counts as 0 in the median.");

function permWarn(s){const W=[];const sm=permSummary(s);
  if(sm.n>0&&sm.n<4)W.push(`Only ${sm.n} borehole${sm.n>1?"s":""} with a result. The SPM requires at least 4 permeability tests in the dispersal area (Vol II, p.II-7).`);
  const sx=sixWarn(s,sm.n,num(s.perm.holeDepth),"permeability tests");if(sx)W.push(sx);
  const z=s.perm.holes.filter(h=>{const c=holeCalc(s.perm,h);return c.nUsed&&c.avg===0});if(z.length)W.push(`No measurable drop at borehole ${z.map(h=>h.name).join(", ")}: report Kfs as less than 10 mm/day (A11).`);
  if(sm.n>=2&&sm.min>0&&sm.max>10*sm.min&&sm.n<6)W.push(`Highest Kfs (${fmt(sm.max)}) is more than 10 times the lowest (${fmt(sm.min)}). The SPM requires at least 6 tests when this happens (A11).`);
  const fi=permFinfo(s.perm);if(fi.outside)W.push(`Finished hole diameter ${fmt(fi.dia,1)} cm is outside the SPM soil factor chart (7–22 cm). F uses the nearest chart value.`);
  const un=s.perm.holes.filter(h=>{const c=holeCalc(s.perm,h);return isFinite(c.kfs)&&c.avg>0&&!c.stable});if(un.length)W.push(`Not stable yet: borehole ${un.map(h=>h.name).join(", ")}.`);
  const rl=s.perm.holes.filter(h=>holeWarn(s,h).some(x=>x.startsWith("Restrictive")));if(rl.length)W.push(`Restrictive layer within 30 cm of the hole base at borehole ${rl.map(h=>h.name).join(", ")}.`);
  return W}
function percWarn(s){const W=[];const sm=percSummary(s);
  if(sm.n>0&&sm.n<4)W.push(`Only ${sm.n} perc test${sm.n>1?"s":""} with a result. The SPM requires at least 4 percolation tests in the dispersal area (Vol II, p.II-7).`);
  const pd=median(s.perc.tests.filter(t=>isFinite(percCalc(t))).map(t=>num(t.depth)));const sx=sixWarn(s,sm.n,pd,"percolation tests");if(sx)W.push(sx);

const spmChecks=(s,k)=>(k==="perm"?(permSummary(s).n?permWarn(s):[]):(percSummary(s).n?percWarn(s):[])).map(w=>w.replace(/[“”]/g,'"'));
const warnHtml=W=>W.length?W.map(w=>`<div class="note warn">${esc(w)}</div>`).join(""):"";
function sbStatus(s,grp,k,spm){if(s.setbacks.na[grp+"_"+k])return"na";const v=num(s.setbacks[grp][k]);if(!isFinite(v))return"";return v>=spm?"ok":"bad"}

    const sw=opt.swatch?`<span class="sw" style="background:${opt.swatch(val)}"></span>`:"";
    return`<button type="button" class="chip" data-chip="${esc(path)}" data-val="${esc(val)}" aria-pressed="${on}">${sw}${esc(txt)}</button>`}).join("")
    +(allow?`<button type="button" class="chip" data-chip="${esc(path)}" data-val="__other" aria-pressed="${isOther}">Other…</button>`:"");
  return`<div class="field" data-chipfield="${esc(path)}"><span class="lbl">${esc(label)}${multi?' <span class="unit">(pick any)</span>':""}</span><div class="chips" role="group" aria-label="${esc(label)}">${items}</div>${allow?otherInput(otherPath,label,otherVal,isOther):""}</div>`}
const vegText=s=>[...s.site.vegetation,s.site.vegetationOther].filter(Boolean).join(", ");
const colourHex=n=>(COLOURS.find(c=>c[0]===n)||[0,"transparent"])[1];
const isDark=hex=>{if(!hex||hex[0]!=="#")return false;const n=parseInt(hex.slice(1),16);return((n>>16)*299+((n>>8)&255)*587+(n&255)*114)/1000<120};

function setBar(title,sub,back,right){$("#bar").innerHTML=`${back?`<button class="iconbtn" data-act="back" aria-label="Back">${IC.back}</button>`:""}<h1${String(title).length>20?' class="long"':""}>${esc(title)}${sub?`<span class="sub">${esc(sub)}</span>`:""}</h1>${right||""}`}

let NAVBACK=false;
function go(v){const prev=view&&view.name;view=v;render();window.scrollTo(0,0);const a=$("#app");if(a&&prev&&prev!==v.name&&!matchMedia("(prefers-reduced-motion:reduce)").matches){a.classList.remove("pg-in","pg-back");void a.offsetWidth;a.classList.add(NAVBACK?"pg-back":"pg-in");a.addEventListener("animationend",()=>a.classList.remove("pg-in","pg-back"),{once:true})}NAVBACK=false}
function hideSplash(){const sp=$("#splash");if(!sp)return;requestAnimationFrame(()=>{sp.classList.add("gone");setTimeout(()=>sp.remove(),450)})}
function back(){NAVBACK=true;const v=view;if(v.name==="layer"||v.name==="pit")go(v.name==="layer"?{name:"pit",siteId:v.siteId,pitId:v.pitId}:{name:"pits",siteId:v.siteId});
  else if(v.name==="hole")go({name:"perm",siteId:v.siteId});else if(v.name==="site"||v.name==="settings")go({name:"home"});else if(v.name==="terms")go({name:"settings"});else if(v.name==="privacy")go(v.from||{name:"settings"});else go({name:"site",siteId:v.siteId})}

    <div class="field"><span class="lbl">GPS point</span>${gpsBox(`perc.tests.${t.id}`,t)}</div>
    <div class="field"><span class="lbl">Photos</span>${linkPhotos(s,"perc:"+t.id,"Perc test "+(i+1))}</div>
    ${s.perc.tests.length>1?`<button class="btn sm ghost" data-act="delperc" data-id="${t.id}" style="align-self:flex-start;color:var(--bad)">${IC.trash} Remove test ${i+1}</button>`:""}</div>`).join("");
  return`<div class="figs"><div class="fig"><span class="k">Perc rate for sizing</span><span class="v" data-calc="percavg"></span></div></div>
  <div class="card"><h2>Tests</h2><p class="hint">Each test reports its slowest timing (the highest min/in). The sizing rate is the median of those (SPM A6–A7).</p><div data-calc="percwarn"></div>${tests}
  <button class="btn" data-act="addperc">${IC.plus} Add test</button></div>`},

sb(){const s=cur();setBar("Setbacks","SPM Table II-19 · "+(s.prop.address||""),true);setActions(`<button class="btn primary" data-act="back">Done</button>`);
  const grp=(g,L,title)=>`<div class="card"><h2>${title}</h2><div class="sb"><span class="hdr">Feature · SPM min.</span><span class="hdr r">Measured (m)</span><span class="hdr r">Status</span>
    ${L.map(([k,name,spm])=>{const na=!!s.setbacks.na[g+"_"+k];return`<span class="name">${esc(name)}<small>min ${spm} m</small></span>
      <span>${na?`<button class="tog" style="width:100%" data-act="sbna" data-k="${g}_${k}" aria-pressed="true">None</button>`:inp(`setbacks.${g}.${k}`,"",{num:true,aria:name+" measured distance"})}</span>
      <span class="st" data-calc="sb" data-g="${g}" data-k="${k}" data-spm="${spm}"></span>`}).join("")}</div>
    <p class="hint">Tap a status to mark the feature as not present.</p></div>`;
  return`${grp("da",SB_DA,"From discharge area")}${grp("tk",SB_TK,"From tanks, sewers &amp; pipes")}
  <div class="card">${area("setbacks.comments","Comments",{ph:"How distances were measured, features on neighbouring lots"})}</div>`},

photos(){const s=cur();setBar("Photos",s.prop.address,true);
  setActions(`<label class="btn primary" style="cursor:pointer">${IC.cam} Add photo<input type="file" accept="image/*" id="photoin" multiple hidden></label>`);
  return s.photos.length?`<div class="photos">${s.photos.map((ph,i)=>`<div class="photo"><img data-thumb="${ph.id}" src="${THUMBS.get(ph.id)||""}" alt="${esc(ph.caption||"Site photo "+(i+1))}"><span class="hint mono" style="font-size:12px">${esc(photoGeo(ph)||"No location recorded")}</span>${inp(`photos.${ph.id}.caption`,"",{ph:"Caption",aria:"Photo caption"})}${ph.link&&linkLabel(s,ph.link)?`<span class="pill">${esc(linkLabel(s,ph.link))}</span>`:sel(`photos.${ph.id}.pit`,"",s.pits.map(p=>p.name),{ph:"Link to test pit…",noOther:true})}<button class="btn sm danger" data-act="delphoto" data-id="${ph.id}">Remove</button></div>`).join("")}</div>`
   :`<div class="card center"><h2>No photos yet</h2><p class="hint">Photograph each test pit profile with a tape for scale, plus the proposed dispersal area.</p></div>`},

exp(){const s=cur();setBar("Export & email",s.prop.address,true);setActions(`<button class="btn primary" data-act="doexport" id="dobtn">${IS_DESKTOP?IC.download:IC.send} ${IS_DESKTOP?"Download "+(fmtsSel().length>1?fmtsSel().length+" files":"file"):"Create "+(fmtsSel().length>1?fmtsSel().length+" files":"file")+" &amp; send"}</button>`);

    <ul class="hint" style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:2px">${F.map(v=>`<li>${DESC[v]}</li>`).join("")}</ul></div>
  <div class="card"><h2>Photos</h2><div class="field"><span class="lbl">Include photos with report?</span><div class="chips" role="group" aria-label="Include photos with report?">${["Yes","No"].map(x=>`<button class="chip" data-act="incphotos" data-val="${x}" aria-pressed="${(S.settings.includePhotos||"Yes")===x}">${x}</button>`).join("")}</div></div>
    <p class="hint">${!s.photos.length?"This site has no photos yet.":(S.settings.includePhotos||"Yes")==="Yes"?`${s.photos.length} photo${s.photos.length===1?"":"s"} will be added at the end, grouped by test pit, borehole and perc test, then overall site photos.`:"Photos stay on your phone and are left out of the report."}</p></div>
  <div class="card"><h2>Send to</h2>
    <div class="field"><label for="sendto">Email address</label><input id="sendto" type="email" value="${esc(S.settings.email||(S.auth&&S.auth.email)||"")}" placeholder="you@company.com" data-setting="email"></div>

      <li>${s.pits.length} test pit${s.pits.length===1?"":"s"}, ${s.pits.reduce((a,p)=>a+p.layers.length,0)} layers</li>
      <li>${sum.perm.n} permeability test${sum.perm.n===1?"":"s"}${sum.perc.n?`, ${sum.perc.n} percolation test${sum.perc.n===1?"":"s"}`:""}${Math.max(sum.perm.n,sum.perc.n)<4?' <span class="pill bad">SPM asks for 4+ permeability or percolation tests</span>':""}</li>
      <li>Setbacks: ${sum.sb.bad?`<span class="pill bad">${sum.sb.bad} below minimum</span>`:`${sum.sb.ok} OK, ${sum.sb.blank} blank`}</li>

  <p class="hint" id="exstatus" aria-live="polite"></p>`},

function refreshCalcs(){const s=cur();if(!s)return;
  document.querySelectorAll("[data-calc]").forEach(el=>{const k=el.dataset.calc;
    if(k==="profile"){const p=pitById(s,view.pitId);el.innerHTML=profileSvg(p)}
    else if(k==="pitlim"){const p=pitById(s,view.pitId);el.textContent="Limiting: "+fmt(pitLimiting(p))+" cm"}
    else if(k==="kfsavg"){el.innerHTML=`${fmt(permSummary(s).avg)} <small>mm/d</small>`}
    else if(k==="kfsn"){el.textContent=permSummary(s).n}
    else if(k==="permF"){const fi=permFinfo(s.perm);el.textContent=`F = ${fmt(fi.F,2)} · ${fi.soilLabel}, ${isFinite(fi.dia)?fmt(fi.dia,1)+" cm hole":"8 cm hole (enter the finished diameter)"}${fi.interp&&!fi.outside?" (interpolated)":""} · SPM chart p.A13`}
    else if(k==="permwarn"){el.innerHTML=warnHtml(permWarn(s))}
    else if(k==="percwarn"){el.innerHTML=warnHtml(percWarn(s))}
    else if(k==="holewarn"){const h=s.perm.holes.find(x=>x.id===view.holeId);el.innerHTML=h?warnHtml(holeWarn(s,h)):""}
    else if(k==="permarea"){el.textContent=`Volume factor ${fmt(permArea(s.perm),2)} mL per mm of fall (0.3142 × R², SPM Table III-21)`}
    else if(k==="rate"||k==="havg"||k==="hkfs"){const h=s.perm.holes.find(x=>x.id===view.holeId);if(!h)return;const c=holeCalc(s.perm,h);
      if(k==="rate"){const i=+el.dataset.i;const v=c.rates[i];el.textContent=isFinite(v)?v.toFixed(1):"";el.style.fontWeight=c.usedIdx.has(i)?"700":"";el.title=c.usedIdx.has(i)?"Used for the stable rate":""}
      if(k==="havg")el.innerHTML=`${fmt(c.avg,2)} <small>mm/min${c.nUsed?(c.stable?" · stable":" · not stable"):""}</small>`;if(k==="hkfs")el.innerHTML=`${fmt(c.kfs)} <small>mm/d</small>`}
    else if(k==="perclow"){const v=percCalc(s.perc.tests[+el.dataset.i]);const st=percStable(s.perc.tests[+el.dataset.i]);el.textContent=isFinite(v)?`Slowest ${fmt(v,1)} min/in${st===false?" · not stable":""}`:""}
    else if(k==="percavg"){el.innerHTML=`${fmt(percSummary(s).avg,1)} <small>min/in</small>`}
    else if(k==="sb"){const st=sbStatus(s,el.dataset.g,el.dataset.k,+el.dataset.spm);
      el.innerHTML=`<button class="pill ${st==="ok"?"ok":st==="bad"?"bad":"na"}" style="border:0" data-act="sbna" data-k="${el.dataset.g}_${el.dataset.k}">${st==="ok"?"OK":st==="bad"?"Short":st==="na"?"N/A":"—"}</button>`}
  })}

function profileSvg(p){if(!p)return"";const depth=Math.max(num(p.depth)||0,...p.layers.map(l=>num(l.to)).filter(isFinite),100);
  const H=Math.min(340,Math.max(200,depth*1.6));const y=d=>(d/depth)*H;
  const lyr=p.layers.map(l=>{const a=num(l.from),b=num(l.to);if(!isFinite(a)||!isFinite(b)||b<=a)return"";const c=colourHex(l.colour);
    return`<div class="lyr ${isDark(c)?"dk":""}" style="top:${y(a)}px;height:${y(b)-y(a)}px;background:${c==="transparent"?"var(--surface)":c}">${b-a>=12?esc((l.texture||"").split(" ").map(w=>w[0]).join("").toUpperCase()):""}</div>`}).join("");
  const m=[];if(isFinite(num(p.shwt)))m.push(`<div class="mark" style="top:${y(num(p.shwt))}px" title="SHWT"></div>`);
  if(p.wtObserved==="Yes"&&isFinite(num(p.wtDepth)))m.push(`<div class="mark" style="top:${y(num(p.wtDepth))}px;border-top-style:solid"></div>`);
  if(isFinite(num(p.rlDepth)))m.push(`<div class="mark rl" style="top:${y(num(p.rlDepth))}px"></div>`);
  const ticks=[];const step=depth>200?50:25;for(let d=0;d<=depth;d+=step)ticks.push(`<span style="position:absolute;top:${y(d)-7}px;right:0">${d}</span>`);
  return`<div style="display:grid;grid-template-columns:30px 1fr;gap:6px" role="img" aria-label="Soil profile diagram for ${esc(p.name)}"><div class="ticks" style="height:${H}px">${ticks.join("")}</div><div class="profile" style="height:${H}px">${lyr}${m.join("")}</div></div>`}

  try{r=await fetch(AUTH_CFG.url.replace(/\/+$/,"")+path,{method:"POST",headers:Object.assign({"Content-Type":"application/json",apikey:AUTH_CFG.key},token?{Authorization:"Bearer "+token}:{},path.startsWith("/rest/")?{Prefer:"return=minimal"}:{}),body:JSON.stringify(body||{})})}
  catch(e){const er=new Error("Couldn't reach the server. Sign-in needs signal, so try again when you have coverage.");er.offline=true;throw er}
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok){const code=(j&&(j.error_code||j.code||j.error))||"";const er=new Error(authMsg(r.status,code,j));er.status=r.status;er.code=code;throw er}return j}
function authMsg(st,code,j){if(st===429||code==="over_email_send_rate_limit"||code==="over_request_rate_limit")return"Too many tries. Wait a minute, then try again.";
  if(code==="otp_expired"||code==="invalid_credentials"||(st===403&&!code))return"That code is wrong or has expired. Check the newest email, or send a new code.";
  if(code==="user_banned")return"This account has been suspended. Contact West Coast Septic if you think this is a mistake.";
  if(code==="validation_failed"||code==="email_address_invalid")return"Check the email address and try again.";
  if(code==="signup_disabled"||code==="otp_disabled")return"New accounts aren't open right now.";
  return(j&&(j.msg||j.error_description||j.message))||"Something went wrong ("+st+"). Try again."}
function setSession(j){const old=S.auth||{};const email=String((j.user&&j.user.email)||old.email||"").toLowerCase();
  S.auth={access:j.access_token,refresh:j.refresh_token,exp:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600),id:(j.user&&j.user.id)||old.id,email,since:old.email===email&&old.since?old.since:localStamp(new Date())};
  if(!S.settings.email)S.settings.email=email;return writeMeta()}
function endSession(msg){S.auth=null;SIGNIN={step:"email",email:"",msg:msg||"",sentAt:0};keepSignin();writeMeta();go({name:"signin"})}
async function freshToken(){if(!S.auth)throw new Error("Not signed in");if(S.auth.exp-60>Date.now()/1000)return S.auth.access;
  try{await setSession(await authCall("/auth/v1/token?grant_type=refresh_token",{refresh_token:S.auth.refresh}))}
  catch(e){if(!e.offline&&e.status>=400&&e.status<500&&ENDED.includes(e.code)){endSession(e.code==="user_banned"?authMsg(0,"user_banned"):"You've been signed out. Sign in again to keep using the app. Your sites are still on this device.")}throw e}
  return S.auth.access}
let syncing=false;
async function syncAuth(){if(!AUTH_ON||!S.auth||syncing||navigator.onLine===false)return;syncing=true;
  try{await freshToken();const t=S.settings.terms;
    if(t&&!t.logged&&(t.uid?t.uid===S.auth.id:t.email===S.auth.email)){await authCall("/rest/v1/terms_acceptances",{terms_version:t.version,accepted_at:t.iso||new Date().toISOString(),app_version:APP_VERSION},await freshToken());t.logged=true;await writeMeta()}
    /* one activity mark per day (account + date only) for active-user counts */
    const day=localStamp(new Date()).slice(0,10);let last="";try{last=localStorage.getItem("ssfl_active")||""}catch(e){}
    if(last!==day){await authCall("/rest/v1/rpc/log_activity",{},await freshToken());try{localStorage.setItem("ssfl_active",day)}catch(e){}}}
  catch(e){}finally{syncing=false}}
window.addEventListener("online",syncAuth);document.addEventListener("visibilitychange",()=>{if(!document.hidden)syncAuth()});
async function signinSend(resend){const msg=$("#simsg"),btn=$("#sibtn");const email=(SIGNIN.email||"").trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){msg.textContent="Enter your full email address, like you@company.com.";return}
  const wait=Math.ceil(60-(Date.now()-SIGNIN.sentAt)/1000);if(resend&&wait>0){msg.textContent=`You can ask for a new code in ${wait} seconds.`;return}
  if(btn)btn.disabled=true;msg.textContent="Sending…";
  try{await authCall("/auth/v1/otp",{email,create_user:true});SIGNIN={step:"code",email,msg:resend?"New code sent. Use the newest email.":"",sentAt:Date.now()};keepSignin();render();const c=$("#si_code");c&&c.focus()}
  catch(e){msg.textContent=e.message;if(btn)btn.disabled=false}}
async function signinVerify(){const msg=$("#simsg"),btn=$("#sibtn");const code=($("#si_code").value||"").replace(/\D/g,"");
  if(code.length<6){msg.textContent="Enter the code from the email.";return}
  btn.disabled=true;msg.textContent="Checking…";
  try{await setSession(await authCall("/auth/v1/verify",{type:"email",email:SIGNIN.email,token:code}));SIGNIN={step:"email",email:"",msg:"",sentAt:0};keepSignin();go({name:termsAccepted()?"home":"termsgate"});toast("Signed in as "+S.auth.email)}
  catch(e){msg.textContent=e.message;btn.disabled=false}}
async function signOut(){const tok=S.auth&&S.auth.access;if(tok)authCall("/auth/v1/logout?scope=local",{},tok).catch(()=>{});endSession("Signed out. Your sites are still on this device.")}
async function deleteAccount(btn){const msg=$("#acctmsg");
  if(!btn.dataset.armed){btn.dataset.armed="1";btn.textContent="Tap again to delete";msg.textContent="This deletes your account. Your sites stay on this device, but you'll need to sign in again to use the app.";return}
  btn.disabled=true;msg.textContent="Deleting…";
  try{await authCall("/rest/v1/rpc/delete_my_account",{},await freshToken());endSession("Your account was deleted. Your sites are still on this device.")}
  catch(e){btn.disabled=false;delete btn.dataset.armed;btn.textContent="Delete account";msg.textContent=e.offline?"Deleting your account needs signal. Try again when you have coverage.":e.message}}

function confirmSheet(title,body,okText,onOk){$("#overlay").innerHTML=`<div class="sheet-bg" data-close="1"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh_t"><h2 id="sh_t">${esc(title)}</h2><p class="hint">${esc(body)}</p><button class="btn danger block" id="sh_ok">${esc(okText)}</button><button class="btn block" id="sh_no">Cancel</button></div></div>`;
  const close=()=>$("#overlay").innerHTML="";$("#sh_no").onclick=close;$("#sh_ok").onclick=()=>{close();onOk()};$(".sheet-bg").onclick=e=>{if(e.target.dataset.close)close()};$("#sh_ok").focus()}

/* GPS */
function gpsBox(path,o){const has=o.lat!==""&&o.lat!=null&&o.lat!==undefined;
  return`<div class="gpsbox"><div class="row">${inp(path+".lat","",{ph:"Latitude",num:true,signed:true,aria:"Latitude"})}${inp(path+".lon","",{ph:"Longitude, e.g. -123.75",num:true,signed:true,aria:"Longitude"})}</div>
    <button class="btn sm" data-act="ptgps" data-path="${path}" style="align-self:flex-start">${IC.pin} ${has?"Update GPS point":"Add GPS point"}</button>${o.gpsAcc?`<span class="hint" style="margin:0">Accuracy ±${esc(o.gpsAcc)} m</span>`:""}</div>`}
function ptGps(path,btn){const o=getPath(path);if(!o)return;if(!navigator.geolocation){toast("Location isn't available on this device. Type the coordinates instead.");return}
  if(btn){btn.disabled=true;btn.textContent="Getting location…"}
  navigator.geolocation.getCurrentPosition(pos=>{o.lat=pos.coords.latitude.toFixed(6);o.lon=pos.coords.longitude.toFixed(6);o.gpsAcc=Math.round(pos.coords.accuracy);save();render();toast("GPS point saved")},
    err=>{if(btn)btn.disabled=false;render();toast(err.code===1?"Location permission was refused. Allow location for this app in your phone settings.":"Couldn't get a location fix. Try again in the open.")},{enableHighAccuracy:true,timeout:20000,maximumAge:0})}
const percUsed=s=>s.perc.tests.map((t,i)=>({t,n:i+1})).filter(({t})=>t.depth!==""||t.t.some(x=>x!==""));
const percGpsLine=s=>{const L=percUsed(s).map(({t,n})=>gpsTxt(t)?`Test ${n}: ${gpsTxt(t)}`:"").filter(Boolean);return L.length?"GPS points (lat, lon): "+L.join("; "):""};
const gpsTxt=o=>o&&o.lat!==""&&o.lat!=null&&o.lon!==""&&o.lon!=null?`${o.lat}, ${o.lon}`:"";
function linkPhotos(s,link,label){const L=s.photos.filter(ph=>ph.link===link);
  return`<div class="linkphotos">${L.length?`<div class="photos sm">${L.map(ph=>`<div class="photo"><img data-thumb="${ph.id}" src="${THUMBS.get(ph.id)||""}" alt="${esc(ph.caption||label+" photo")}">${inp(`photos.${ph.id}.caption`,"",{ph:"Caption",aria:"Photo caption"})}<button class="btn sm danger" data-act="delphoto" data-id="${ph.id}">Remove</button></div>`).join("")}</div>`:""}
    <label class="btn sm" style="cursor:pointer;align-self:flex-start">${IC.cam} Add photos${L.length?" ("+L.length+")":""}<input type="file" accept="image/*" class="linkphotoin" data-link="${link}" multiple hidden></label></div>`}
function getGps(){const s=cur();const hint=document.querySelector('[data-calc="gpsacc"]');
  if(!navigator.geolocation){hint.textContent="Location isn't available on this device. Type the coordinates instead.";return}
  hint.textContent="Getting your location…";
  navigator.geolocation.getCurrentPosition(pos=>{s.prop.lat=pos.coords.latitude.toFixed(6);s.prop.lon=pos.coords.longitude.toFixed(6);s.prop.gpsAcc=Math.round(pos.coords.accuracy);save();render();toast("Location saved")},
    err=>{hint.textContent=err.code===1?"Location permission was refused. Allow location for this app in your phone settings, or type the coordinates.":"Couldn't get a location fix. Try again in the open, or type the coordinates."},{enableHighAccuracy:true,timeout:20000,maximumAge:0})}

/* Permeability minute timer */
let timer=null;
function toggleTimer(){const btn=$("#timerbtn");if(timer){clearInterval(timer.int);timer=null;btn.innerHTML=IC.timer+" Start timer";return}
  const t0=Date.now();let lastMin=0;timer={int:setInterval(()=>{const sec=Math.floor((Date.now()-t0)/1000);const c=$("#clock");if(c)c.textContent=Math.floor(sec/60)+":"+String(sec%60).padStart(2,"0");
    const m=Math.floor(sec/60);if(m>lastMin){lastMin=m;try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}beep();const f=document.querySelector(`tr[data-row="${m}"] input`);if(f){f.focus();f.scrollIntoView({block:"center"})}}},250)};
  btn.innerHTML="Stop timer";try{const f=document.querySelector('tr[data-row="0"] input');f&&f.focus()}catch(e){}}

let actx=null;function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+.25)}catch(e){}}

const THUMBS=new Map();
async function fillThumbs(){for(const img of document.querySelectorAll("img[data-thumb]")){if(img.getAttribute("src"))continue;const id=img.dataset.thumb;let d=THUMBS.get(id);if(!d){d=await store.get("th:"+id)||await store.get("ph:"+id);if(d)THUMBS.set(id,d)}if(d)img.src=d}}
async function withPhotos(s){if(!s.photos.length||s.photos.every(p=>p.data))return s;const photos=await Promise.all(s.photos.map(async p=>({...p,data:p.data||await store.get("ph:"+p.id)||THUMBS.get(p.id)||await store.get("th:"+p.id)})));return{...s,photos:photos.filter(p=>p.data)}}
function resizeImage(file,max,q,type="image/jpeg"){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);const x=c.getContext("2d");if(type==="image/jpeg"){x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height)}x.drawImage(img,0,0,c.width,c.height);res(c.toDataURL(type,q))};img.onerror=rej;img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
function parseExif(buf){try{const d=new DataView(buf);if(d.getUint16(0)!==0xFFD8)return null;let o=2;
  while(o<d.byteLength-4){const m=d.getUint16(o);if((m&0xFF00)!==0xFF00)return null;if(m===0xFFE1&&d.getUint32(o+4)===0x45786966)return readTiff(d,o+10);o+=2+d.getUint16(o+2)}}catch(e){}return null}
function readTiff(d,t){const le=d.getUint16(t)===0x4949;const u16=p=>d.getUint16(p,le),u32=p=>d.getUint32(p,le);
  const ifd=off=>{const n=u16(t+off);const g={};for(let i=0;i<n;i++){const e=t+off+2+i*12;g[u16(e)]={count:u32(e+4),vo:e+8}}return g};
  const rat=p=>u32(p)/u32(p+4);const str=g=>{const p=g.count>4?t+u32(g.vo):g.vo;let s="";for(let i=0;i<g.count-1;i++)s+=String.fromCharCode(d.getUint8(p+i));return s};
  const out={};const i0=ifd(u32(t+4));
  if(i0[0x8769]){const ex=ifd(u32(i0[0x8769].vo));const tg=ex[0x9003]||ex[0x9004];if(tg){const m=str(tg).match(/(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d)/);if(m)out.time=`${m[1]}-${m[2]}-${m[3]} ${m[4]}:${m[5]}`}}
  if(i0[0x8825]){const g=ifd(u32(i0[0x8825].vo));const dms=x=>{const p=t+u32(x.vo);return rat(p)+rat(p+8)/60+rat(p+16)/3600};

async function makeBackup(){const msg=$("#bkmsg"),btn=$("#bkbtn");if(btn)btn.disabled=true;msg.textContent="Preparing backup…";flush();
  try{const photos={};let n=0;for(const st of S.sites)for(const ph of st.photos||[]){const d=await store.get("ph:"+ph.id);if(d){photos[ph.id]={d,t:await store.get("th:"+ph.id)||""};n++}}
    const {logo,company,name,email,phone,reg}=S.settings;
    const data={app:"site-soil-field-log",kind:"backup",format:1,appVersion:APP_VERSION,created:new Date().toISOString(),settings:{logo,company,name,email,phone,reg},sites:S.sites,photos};
    const file=new File([JSON.stringify(data)],`Site and Soil backup - ${today()}.json`,{type:"application/json"});
    S.settings.lastBackup=localStamp(new Date());saveMeta();
    await deliverFiles([file],msg,`Site & Soil Field Log backup: ${S.sites.length} sites, ${n} photos`);
  }catch(e){msg.textContent="The backup couldn't be made: "+(e.message||e)}if(btn)btn.disabled=false}
async function restoreBackup(f){const msg=$("#bkmsg");msg.textContent="Reading backup…";let data;
  try{data=JSON.parse(await f.text())}catch(e){msg.textContent="That file isn't a Site & Soil backup.";return}
  if(!data||data.app!=="site-soil-field-log"||!Array.isArray(data.sites)){msg.textContent="That file isn't a Site & Soil backup.";return}
  const have=new Map(S.sites.map(x=>[x.id,x]));const add=data.sites.filter(x=>x&&x.id&&!have.has(x.id));const upd=data.sites.filter(x=>x&&x.id&&have.has(x.id)&&(x.updated||0)>(have.get(x.id).updated||0));
  const keep=data.sites.length-add.length-upd.length;
  if(!add.length&&!upd.length){msg.textContent=`Nothing to restore: all ${data.sites.length} sites in the backup are already here and up to date.`;return}
  confirmSheet(`Restore ${add.length+upd.length} site${add.length+upd.length===1?"":"s"}?`,`From a backup made ${String(data.created||"").slice(0,10)}: ${add.length} new, ${upd.length} newer than the copy on this device${keep?`, ${keep} already up to date (skipped)`:""}. Sites only on this device are kept.`,"Restore",async()=>{
    msg.textContent="Restoring…";const P=data.photos||{};

      const i=S.sites.findIndex(y=>y.id===st.id);if(i>=0)S.sites[i]=st;else S.sites.push(st)}
    const ds=data.settings||{};let ch=false;["logo","company","name","email","phone","reg"].forEach(k=>{if(!S.settings[k]&&ds[k]){S.settings[k]=ds[k];ch=true}});if(ch)saveMeta();

  const rows=[["Location"].concat(...s.perm.holes.map(h=>[h.location,""])),["Nearest test pit"].concat(...s.perm.holes.map(h=>[h.pit,""])),["GPS (lat, lon)"].concat(...s.perm.holes.map(h=>[gpsTxt(h),""]))];const exclCells=new Set();
  for(let m=0;m<maxM;m++){if(!s.perm.holes.some(h=>(h.readings[m]??"")!==""))continue;
    rows.push(["Minute "+m].concat(...s.perm.holes.map((h,i)=>{const r=calcs[i].rates[m];const x=isFinite(r)&&!calcs[i].usedIdx.has(m);if(x)exclCells.add(rows.length+":"+(2+i*2));return[nv(h.readings[m]??""),isFinite(r)?r.toFixed(2)+(x?" *":""):""]})))}
  const firstTot=rows.length;
  rows.push(["Stable rate of fall (mm/min)"].concat(...calcs.map(c=>[isFinite(c.avg)?c.avg.toFixed(2):"",""])),["Flow rate Q (ml/min)"].concat(...calcs.map(c=>[isFinite(c.flow)?c.flow.toFixed(1):"",""])),["Kfs (mm/d)"].concat(...calcs.map(c=>[isFinite(c.kfs)?c.kfs.toFixed(0):"",""])));
  grid(["Borehole"].concat(...s.perm.holes.map(h=>["#"+h.name+" reading (mm)","rate (mm/min)"])),rows,{size:7.5,cols:{0:{halign:"left",fontStyle:"bold",cellWidth:40}},cell:d=>{if(d.section!=="body")return;
    if(d.row.index>=firstTot){d.cell.styles.fillColor=PALE;d.cell.styles.fontStyle="bold"}if(exclCells.has(d.row.index+":"+d.column.index))d.cell.styles.textColor=GREY}});
  para(`Median K(fs) used for design: ${isFinite(sum.perm.avg)?Math.round(sum.perm.avg):"—"} mm/d (${sum.perm.n} boreholes).`,{bold:true,after:1});
  para("Stable rate of fall = median of the last 3 readings not skipped. Rates marked * were not used.",{italic:true,size:7.5,color:GREY});spmChecks(s,"perm").forEach(w=>para("SPM check: "+w,{bold:true,size:7.5,color:[176,40,31],after:1.5}));
  if(sum.perc.n){H("Percolation tests");grid(["Test #","Depth (cm)","#1","#2","#3","#4","#5","#6","Slowest (min/in)"],percUsed(s).map(({t,n})=>[n,nv(t.depth)].concat(t.t.map(nv),[isFinite(percCalc(t))?percCalc(t):""])));para(`Percolation rate for system sizing (median of slowest rates): ${fmt(sum.perc.avg,2)} min/in`,{bold:true});if(percGpsLine(s))para(percGpsLine(s),{size:8.5});spmChecks(s,"perc").forEach(w=>para("SPM check: "+w,{bold:true,size:7.5,color:[176,40,31],after:1.5}))}

  /* Table 2 */
  title("Table 2 – Setback Distances","portrait");
  [["From discharge area",SB_DA,"da"],["From subsurface tank, sewer or pipe",SB_TK,"tk"]].forEach(([tt,L,g])=>{H(tt);
    grid(["Feature","SPM min. (m)","This project (m)","OK?"],L.map(([k,name,spm])=>{const x=sbStatus(s,g,k,spm);return[name,spm,s.setbacks.na[g+"_"+k]?"N/A":nv(s.setbacks[g][k]),x==="ok"?"OK":x==="bad"?"NO":x==="na"?"N/A":""]}),
      {size:8.5,cols:{0:{halign:"left"}},cell:d=>{if(d.section==="body"&&d.column.index===3){d.cell.styles.fontStyle="bold";if(d.cell.raw==="NO")d.cell.styles.textColor=[176,40,31];if(d.cell.raw==="OK")d.cell.styles.textColor=[43,122,75]}}})});
  if(s.setbacks.comments)para("Comments: "+s.setbacks.comments,{size:8.5});

  /* Photos: two per page */
  if(s.photos.length){title("Site Photographs","portrait");const maxW=W()-2*M,maxH=(Hh()-y-30)/2-10;
    photoGroups(s).forEach(g=>{let first=true;g.items.forEach(({ph,n:i})=>{const r=(ph.w||4)/(ph.h||3);let w=maxW,h=w/r;if(h>maxH){h=maxH;w=h*r}
      const capLines=doc.splitTextToSize(photoCaption(ph,i,g.tag),maxW);const extra=first?9:0;if(y+extra+h+capLines.length*4+6>Hh()-18){doc.addPage("letter","portrait");y=M+4}
      if(first){H(g.title);first=false}
      try{doc.addImage(ph.data,"JPEG",M+(maxW-w)/2,y,w,h)}catch(e){}y+=h+4;
      doc.setFont("helvetica","italic");doc.setFontSize(8.5);doc.setTextColor(...GREY);doc.text(capLines,W()/2,y+1,{align:"center"});y+=capLines.length*4+8})})}

  /* Footers */
  const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont("helvetica","normal");doc.setFontSize(7.5);doc.setTextColor(...GREY);
    doc.text(`${st.company?st.company+"  ·  ":""}${addr}`,M,Hh()-9);doc.text(`Page ${i} of ${n}`,W()-M,Hh()-9,{align:"right"})}
  doc.setProperties({title:fileBase(s),creator:st.name||"Site & Soil Field Log"});
  return doc.output("blob")}

/* ============================================================
   Export – deliver the file (share sheet → email, else save)
   ============================================================ */
function fmtsSel(){const L=Array.isArray(S.settings.formats)?S.settings.formats.filter(x=>["xlsx","docx","pdf","csv"].includes(x)):[];return L.length?L:[S.settings.format||"xlsx"]}
async function saveOne(file,to){if(window.claude&&window.claude.use){const dl=await window.claude.use("downloads");if(dl){await dl.save({filename:file.name,data:file});return}}
  const url=URL.createObjectURL(file);const a=document.createElement("a");a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);await new Promise(r=>setTimeout(r,400))}
/* computers download files; phones and tablets (incl. iPad, which reports as a Mac) use the share menu */
const IS_DESKTOP=!(/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Macintosh/.test(navigator.userAgent)));
async function deliverFiles(files,status,text,to=""){const names=files.map(f=>"“"+f.name+"”").join(", ");
  const share=async()=>{try{await navigator.share({files,title:files.length>1?files.length+" files":files[0].name,text});status.textContent="Sent to your share menu. Pick Mail, check the address and tap Send.";return true}
    catch(e){if(e&&e.name==="AbortError"){status.textContent="Share cancelled. Tap the button again when you're ready.";return true}
      if(e&&e.name==="NotAllowedError"){status.innerHTML=`Your ${files.length>1?"files are":"file is"} ready. <button class="btn sm primary" id="sharenow">Send now</button>`;const b=$("#sharenow");if(b)b.onclick=async()=>{b.disabled=true;if(!await share())await saveAll()};return true}return false}};
  const saveAll=async()=>{try{for(const f of files)await saveOne(f,to);status.textContent=`Saved ${names}.${to?" Attach "+(files.length>1?"them":"it")+" to an email to "+to+".":""}`}catch(e){status.textContent="The save was cancelled."}return true};
  if(!IS_DESKTOP&&navigator.canShare&&navigator.canShare({files})&&await share())return;
  await saveAll()}
async function doExport(){const s=cur();const btn=$("#dobtn");const status=$("#exstatus");const fm=fmtsSel();
  btn.disabled=true;status.textContent=fm.length>1?`Building ${fm.length} files…`:"Building your file…";
  try{const s2=S.settings.includePhotos==="No"?{...s,photos:[]}:s;const files=[];
    for(const f of fm){const blob=f==="docx"?await buildDocx(s2):f==="pdf"?await buildPdf(s2):f==="csv"?await buildCsv(s2):await buildXlsx(s2);files.push(new File([blob],fileBase(s)+"."+f,{type:blob.type}))}
    s.sentAt=localStamp(new Date()).slice(0,10);if(!s.status||s.status==="In progress")s.status="Sent";save();
    const to=($("#sendto")||{}).value||S.settings.email||(S.auth&&S.auth.email)||"";
    await deliverFiles(files,status,`Site and soil field log for ${s.prop.address||"site"}${to?" – send to "+to:""}`,to);
  }catch(e){status.textContent=e.message||"Something went wrong building the file. Try again."}
  btn.disabled=false}


function moreExamples(){const rows=[["Example: 1880 Lockyer Road, Roberts Creek","Example: P. Nakamura","2026-10-14",49.4207,-123.6390,"Complete","26-0019"],["Example: 5521 Sunshine Coast Hwy, Sechelt","Example: Halfmoon Bay Holdings","2026-09-30",49.4914,-123.7896,"Sent","26-0024"],["Example: 712 Gower Point Road, Gibsons","Example: L. & D. Osei","2026-08-21",49.3961,-123.5233,"Complete","26-0011"],["Example: 3304 Fort Street, Pender Harbour","Example: M. Fraser","2026-11-03",49.6312,-124.0306,"In progress","26-0031"],["Example: 9058 Redrooffs Road, Halfmoon Bay","Example: Coastline Builders Ltd.","2025-06-12",49.5106,-123.9220,"Complete","25-0042"],["Example: 211 Marine Drive, Granthams Landing","Example: S. Kowalski","2025-04-02",49.4118,-123.4912,"Complete","25-0017"]];
  return rows.map(([addr,cl,d,la,lo,st,f],i)=>{const s=newSite();s.example=true;s.updated=Date.now()-(i+1)*864e5*7;Object.assign(s.prop,{address:addr,client:cl,date:d,lat:String(la),lon:String(lo),fileNo:f});s.status=st;
    Object.assign(s.pits[0],{shwt:String(70+i*12),rlDepth:String(100+i*10),wtObserved:"No"});return s})}
/* ============================================================
   Boot
   ============================================================ */
(async function boot(){const DEF={company:"",name:"",email:"",phone:"",reg:"",logo:"",format:"xlsx",theme:"",photoGps:"Yes",includePhotos:"Yes"};
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  let meta=await store.get("meta");
  if(!meta){const old=await store.get("state");
    if(old&&old.sites){/* move v0.1/0.2 single-record storage to one record per site, photos stored separately */
      for(const s of old.sites){for(const p of s.photos||[]){if(p.data){await store.set("ph:"+p.id,p.data);try{const th=await resizeDataUrl(p.data,360,0.72);await store.set("th:"+p.id,th)}catch(e){}delete p.data}}await saveSite(s)}
      if(old.sites.every(s=>s.example))for(const s of moreExamples())await saveSite(s);
      meta={settings:Object.assign({},DEF,old.settings||{}),ver:2};await store.set("meta",meta);await store.del("state")}
    else{for(const s of [exampleSite(),...moreExamples()])await saveSite(s);meta={settings:DEF,ver:2};await store.set("meta",meta)}}
  S.settings=Object.assign({},DEF,meta.settings||{});S.auth=AUTH_ON&&meta.auth&&meta.auth.refresh?meta.auth:null;S.sites=(await store.getPrefix("site:")).filter(x=>x&&x.id);
  if(!S.sites.length&&!(await store.get("meta"))){/* storage unavailable (private window): keep examples in memory */S.sites=[exampleSite(),...moreExamples()]}
  applyTheme();render();syncAuth();hideSplash()})();
function resizeDataUrl(d,max,q){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",q))};img.onerror=rej;img.src=d})}
window.__ssfl={get state(){return S},flush,withPhotos,buildXlsx,buildDocx,buildPdf,buildCsv,go,cur:()=>cur()};
